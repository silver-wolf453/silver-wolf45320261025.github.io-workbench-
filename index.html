<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>业务工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232456E6'/%3E%3Cpath d='M7 12.5l3.2 3.2L17 9' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F3F4F7; --card:#FFFFFF; --ink:#171A21; --ink2:#5B6270; --ink3:#9AA1AD;
  --line:#E6E8EE; --brand:#2456E6; --brand-d:#1B44C0; --brand-soft:#EAF0FF;
  --red:#D94848; --red-soft:#FDECEC; --amber:#D98A14; --amber-soft:#FBF1DE;
  --green:#2E9E6B; --green-soft:#E6F4EC;
  --r:14px; --r2:10px;
  --shadow:0 1px 2px rgba(20,24,40,.05),0 4px 16px rgba(20,24,40,.05);
  --pa:.85; --blur:blur(12px);
}
html.tl-light{--ink:#fff;--ink2:rgba(255,255,255,.88);--ink3:rgba(255,255,255,.62);--line:rgba(255,255,255,.3)}
html.tl-light body{text-shadow:0 1px 3px rgba(0,0,0,.45)}
:root{--panel:rgba(255,255,255,var(--pa));--panel-in:rgba(255,255,255,calc(var(--pa)*.55))}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.55;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
a{color:var(--brand);text-decoration:none}
svg{display:block}

/* ---------- 布局 ---------- */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:216px;background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-right:1px solid var(--line);padding:20px 12px;display:none;flex-direction:column;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 10px 18px}
.logo .mark{width:30px;height:30px;border-radius:8px;background:var(--brand);display:flex;align-items:center;justify-content:center;flex:none}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;color:var(--ink2);font-size:14.5px;width:100%;text-align:left;margin-bottom:2px}
.nav-item svg{width:19px;height:19px;flex:none}
.nav-item:hover{background:var(--bg)}
.nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.main{min-height:100vh;min-height:100dvh;padding-bottom:84px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar .date{font-size:13px;color:var(--ink3);margin-bottom:2px}
.topbar h1{font-size:22px;font-weight:700;letter-spacing:.5px}

/* ---------- 底部 tabbar（手机） ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-top:1px solid var(--line);display:flex;overflow-x:auto;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.tabbar::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;color:var(--ink3);font-size:11px}
.tab svg{width:21px;height:21px}
.tab.active{color:var(--brand)}

@media(min-width:900px){
  .sidebar{display:flex}
  .main{margin-left:216px;padding-bottom:40px}
  .tabbar{display:none}
  .wrap{padding:26px 28px 60px}
}

/* ---------- 通用组件 ---------- */
.card{background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card+.card{margin-top:14px}
.grid>.card+.card{margin-top:0}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.card-h h3{font-size:15.5px;font-weight:700}
.muted{color:var(--ink3);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--panel-in);color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.ghost{border-color:transparent;color:var(--brand);background:var(--brand-soft)}
.btn.danger{color:var(--red);background:var(--red-soft)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--panel-in);color:var(--ink2);white-space:nowrap}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.grid{display:grid;gap:14px}
@media(min-width:720px){.cols-2{grid-template-columns:1fr 1fr}.cols-4{grid-template-columns:repeat(4,1fr)}.cols-3{grid-template-columns:repeat(3,1fr)}}

/* 统计条 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px}
.stat .n{font-size:24px;font-weight:700;line-height:1.1}
.stat .l{font-size:12px;color:var(--ink2);margin-top:3px}
.stat.red .n{color:var(--red)} .stat.amber .n{color:var(--amber)} .stat.green .n{color:var(--green)}
@media(max-width:520px){.stat .n{font-size:20px}}

/* 最重要 3 件事 */
.focus-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line)}
.focus-item:last-child{border-bottom:none}
.focus-no{width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.focus-item.f1 .focus-no{background:var(--red)}
.focus-item.f2 .focus-no{background:var(--amber)}

/* 任务行 */
.task{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink3);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.check.done{background:var(--green);border-color:var(--green)}
.check svg{width:13px;height:13px;opacity:0}
.check.done svg{opacity:1}
.task-body{flex:1;min-width:0}
.task-title{font-size:14.5px;word-break:break-word}
.task.done .task-title{color:var(--ink3);text-decoration:line-through}
.task-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.task-ops{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.iconbtn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.iconbtn:hover{background:var(--bg);color:var(--brand)}
.iconbtn svg{width:16px;height:16px}
.empty{padding:22px 8px;text-align:center;color:var(--ink3);font-size:13.5px}

/* 项目卡 */
.proj{display:flex;flex-direction:column;gap:10px}
.proj-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.proj-name{font-weight:700;font-size:15px;word-break:break-word}
.bar{height:7px;border-radius:99px;background:var(--panel-in);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.bar.red i{background:var(--red)} .bar.amber i{background:var(--amber)} .bar.green i{background:var(--green)}
.proj-meta{display:flex;flex-wrap:wrap;gap:6px}
.proj-next{font-size:13px;color:var(--ink2);background:var(--panel-in);padding:7px 10px;border-radius:8px}

/* 风险 */
.risk{display:flex;gap:12px;padding:12px;border-radius:var(--r2);border:1px solid var(--line);margin-bottom:10px;align-items:flex-start}
.risk:last-child{margin-bottom:0}
.risk .dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}
.risk.sev-red .dot{background:var(--red)} .risk.sev-amber .dot{background:var(--amber)} .risk.sev-green .dot{background:var(--green)}
.risk.sev-red{border-color:#F3C2C2;background:#FFF8F8}
.risk.sev-amber{border-color:#EFD9AE;background:#FFFCF4}
.risk .cnt{font-weight:700;font-size:18px}

/* 复盘环 */
.ring-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring{width:130px;height:130px;flex:none}
.ring .pct{font-size:24px;font-weight:700}

/* 表单 */
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-in);outline:none;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);background:rgba(255,255,255,.9)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(15,18,30,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.mask.open{display:flex}
.modal{background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
@media(min-width:600px){.mask{align-items:center}.modal{border-radius:18px}}
.modal h3{font-size:17px;margin-bottom:14px}
.modal-ops{display:flex;gap:10px;margin-top:6px}
.modal-ops .btn{flex:1}
.copybox{background:var(--bg);border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;max-height:300px;overflow-y:auto;line-height:1.7}

/* 邮件 */
.mail{padding:11px 0;border-bottom:1px solid var(--line)}
.mail:last-child{border-bottom:none}
.mail .from{font-size:13px;color:var(--ink2)}
.mail .subj{font-weight:600;font-size:14.5px}
.banner{border-radius:var(--r2);padding:11px 13px;font-size:13px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.banner.info{background:var(--brand-soft);color:var(--brand-d)}
.banner.warn{background:var(--amber-soft);color:var(--amber)}
.banner.ok{background:var(--green-soft);color:var(--green)}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#171A21;color:#fff;padding:10px 18px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:99;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 密码锁 */
.lock-mask{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.lock-mask.open{display:flex}
.lock-card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:32px 26px;width:100%;max-width:340px;text-align:center}
.lock-logo{width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 auto 12px}
.lock-card h2{font-size:18px;margin-bottom:4px}
.lock-sub{color:var(--ink3);font-size:13px;margin-bottom:18px}
.lock-card input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);text-align:center;font-size:18px;letter-spacing:4px;outline:none;margin-bottom:10px}
.lock-card input:focus{border-color:var(--brand);background:#fff}
.lock-card .btn{width:100%}
.lock-err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.view{display:none}.view.active{display:block}
.tip{font-size:12.5px;color:var(--ink3);margin-top:6px}
/* 自定义壁纸 */
#bgLayer{position:fixed;inset:0;z-index:-2;background:var(--bg);background-size:cover;background-position:center;background-repeat:no-repeat}
#bgShade{position:fixed;inset:0;z-index:-1;background:rgba(0,0,0,.2);pointer-events:none}
.wp-presets{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0 6px}
.wp-preset{height:44px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.wp-preset.on{border-color:var(--brand)}
.wp-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.wp-row label{flex:0 0 74px;font-size:13px;color:var(--ink2)}
.wp-row input[type=range]{flex:1;accent-color:var(--brand);height:24px}
.wp-row .wv{flex:0 0 40px;font-size:12.5px;color:var(--ink3);text-align:right}
.wp-preview{width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin-bottom:10px;max-height:240px;object-fit:contain;background:#0d1117}
input[type=file]{display:none}
.wp-ops{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.wp-ops .btn{min-height:44px}
/* ================= 本次更新：玻璃、配色与批量选择 ================= */
:root{--surface-rgb:255,255,255;--panel:rgba(var(--surface-rgb),var(--pa));--panel-in:rgba(var(--surface-rgb),calc(var(--pa)*.55));--glass:rgba(255,255,255,.28);--glass-edge:rgba(255,255,255,.48)}
body{background:transparent}
#view-home .card,#view-home .stat{
  background:var(--glass);border-color:var(--glass-edge);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 30px rgba(25,35,60,.08)
}
.item-colored{background:var(--item-bg)!important;color:var(--item-ink)!important;text-shadow:none;--ink:var(--item-ink);--ink2:var(--item-ink);--ink3:var(--item-ink);--line:color-mix(in srgb,var(--item-ink) 25%,transparent);--panel-in:transparent}
.item-colored .muted,.item-colored .tip,.item-colored .proj-next,.item-colored .task-title,.item-colored .iconbtn,.item-colored .switch,.item-colored .field label{color:var(--item-ink)}
.item-colored .chip,.item-colored .btn{color:var(--item-ink);background:var(--panel-in);border-color:var(--line)}
.item-colored .chip,.item-colored .proj-next{box-shadow:inset 0 0 0 1px var(--line)}
.item-colored .bar{background:var(--line)}
.item-colored .iconbtn:hover{background:var(--panel-in);color:var(--item-ink)}
.item-colored .field input,.item-colored .field textarea,.item-colored .field select{background:var(--item-bg);color:var(--item-ink);border-color:var(--line);color-scheme:var(--item-scheme)}
.item-colored .field input:focus,.item-colored .field textarea:focus,.item-colored .field select:focus{outline:2px solid var(--item-ink);outline-offset:1px;background:var(--item-bg)}
.item-colored input::placeholder,.item-colored textarea::placeholder{color:var(--item-ink);opacity:.72}
.item-colored input[type=checkbox]{accent-color:var(--item-ink)}
.item-colored .check{border-color:var(--item-ink)}
.item-colored .check.done{background:var(--item-ink);border-color:var(--item-ink)}
.item-colored .check.done path{stroke:var(--item-bg)}
.task.item-colored{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.task.item-colored:last-child{border-bottom:1px solid var(--line)}
.task.item-colored.done .task-title{color:var(--item-ink)}
.task-selection{appearance:none;-webkit-appearance:none;display:grid;place-items:center;width:20px;height:20px;border:1.5px solid var(--item-ink);border-radius:5px;flex:none;margin:2px 0 0;cursor:pointer;background:transparent}
.task-selection:checked{background:var(--item-ink)}
.task-selection:checked:after{content:'✓';color:var(--item-bg);font-size:14px;font-weight:800;line-height:1}
.task-selection:focus-visible,.drag-handle:focus-visible{outline:2px solid var(--item-ink);outline-offset:3px}
.task-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-left:auto}
.task-batch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.task-batch [hidden]{display:none}
.selection-status{font-size:12px;color:var(--ink2)}
.color-fields{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0 14px}
.color-label{display:inline-flex;align-items:center;gap:8px;font-size:13px}
input[type=color]{width:46px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer}
.color-code{font-variant-numeric:tabular-nums;font-size:12px}
.wp-preset{display:block;width:100%;padding:0}
.wp-row select{max-width:180px;padding:5px;border:1px solid var(--line);border-radius:7px;background:var(--panel-in)}
.project-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.project-toolbar>.muted{flex:1;min-width:150px}
@media(max-width:520px){.task.item-colored{gap:7px;padding:10px 8px}.task-ops{flex-direction:column}.task-tools{gap:6px}.card-h{flex-wrap:wrap}.color-code{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important}.check{transition:none}}

/* 任务拖拽：只有手柄接管触摸，其余区域仍可正常滚动。 */
.sortable-list{position:relative;isolation:isolate;overflow:visible;}
.sortable-list>.task{position:relative;will-change:transform;}
.drag-handle{flex:none;width:24px;min-height:32px;display:inline-flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;border-radius:7px;color:inherit;opacity:.65;}
.drag-handle:hover,.drag-handle:focus-visible{opacity:1;background:rgba(127,127,127,.15);}
.drag-handle svg{width:16px;height:20px;pointer-events:none;}
.drag-handle:focus-visible{outline:2px solid currentColor;outline-offset:2px;}
.task-dragging,.task-dragging *{user-select:none!important;cursor:grabbing!important;}
.sortable-list.is-sorting>.task{transition:none!important;}
.sortable-list.is-sorting>.task.is-dragged{z-index:8;box-shadow:0 14px 32px rgba(20,24,40,.25);outline:2px solid currentColor;outline-offset:1px;}
.sortable-list.is-settling{pointer-events:none;}
.project-deck{position:relative;isolation:isolate;margin:0 -2px;padding:0 2px;transition:height .65s cubic-bezier(.2,.8,.2,1);}
.project-deck>.deck-card{position:absolute;left:0;top:0;margin:0!important;transform-origin:50% 28%;will-change:transform;box-shadow:0 10px 25px rgba(20,24,40,.12);}
.project-deck>.deck-card.deck-under{pointer-events:none;}
.project-deck:not(.is-expanded)>.deck-card:first-child{cursor:pointer;}
.project-deck>.deck-card .proj-name{overflow-wrap:anywhere;}
.deck-controls{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
.deck-hint{font-size:12.5px;color:var(--ink2);margin-bottom:10px;}
@media(max-width:520px){
 .sortable-list>.task{gap:7px;}
 .drag-handle{width:19px;}
 .project-deck>.deck-card{padding:14px;}
}
@media(prefers-reduced-motion:reduce){
 .project-deck{transition:none;}
 .sortable-list>.task{animation:none!important;}
}

</style>
</head>
<body>
<div id="bgLayer"></div>
<div id="bgShade"></div>

<aside class="sidebar">
  <div class="logo"><span class="mark"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>业务工作台</div>
  <nav id="sideNav"></nav>
</aside>

<div class="main">
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="date" id="topDate"></div>
        <h1 id="topTitle">首页</h1>
      </div>
      <button class="btn primary" onclick="openTaskModal()">＋ 新建任务</button>
    </div>

    <section class="view" id="view-home"></section>
    <section class="view" id="view-projects"></section>
    <section class="view" id="view-tasks"></section>
    <section class="view" id="view-risks"></section>
    <section class="view" id="view-review"></section>
    <section class="view" id="view-data"></section>
    <section class="view" id="view-mail"></section>
    <section class="view" id="view-appearance"></section>
    <section class="view" id="view-info"></section>
  </div>
</div>

<nav class="tabbar" id="tabbar"></nav>

<div class="mask" id="mask">
  <div class="modal" id="modalBox"></div>
</div>
<div class="toast" id="toast"></div>
<div class="lock-mask" id="lockMask">
  <div class="lock-card">
    <div class="lock-logo">业</div>
    <h2>业务工作台</h2>

<script>
/* ================= 数据层 ================= */
/* 清理旧版内置示例；保留墓碑，避免云端合并后重新出现。 */
function cleanLegacyDemo(d){
  if(!d||typeof d!=='object'||d.schemaVersion>=2)return d;
  var stamp=new Date().toISOString();
  var demoProjects=[
    ['Q4客户方案','周三前出初稿并发客户确认'],
    ['官网改版','确认首页视觉稿后切开发'],
    ['月度运营报告','补齐数据口径后重出终稿'],
    ['知识库迁移','等IT开通迁移权限']
  ];
  var demoTaskTitles=[
    '月度运营报告终稿提交',
    '客户合同盖章扫描归档',
    'Q4方案初稿内部评审',
    '回复供应商报价邮件',
    '更新本周项目周报',
    '官网首页视觉稿确认',
    'Q4方案终版排版导出',
    '等设计组交付Banner图',
    '等财务确认活动预算',
    '晨会纪要整理分发',
    '上周数据复盘会准备',
    /* 原“邮件”示例的导入待办。 */
    '确认Banner文案并回复设计组',
    '补充活动预算差额说明',
    '整理知识库待迁移目录清单',
    '补发月度运营报告并说明延期原因',
    /* 原“抓取 → 载入演示数据”的导入待办。 */
    '发送官网改版方案到产品评审群',
    '回复赵总确认Q4合同账期'
  ];
  var demoMails=[
    ['客户·王总','Q4方案初稿请尽快安排评审','王总希望本周内看到初稿，确认方向后进入商务谈判。'],
    ['设计组·小林','Banner图还在等你确认文案','Banner 三版已出，文案确认后今天可出终图。'],
    ['财务·张姐','10月活动预算审批结果','预算已批复80%，差额部分需补充说明。'],
    ['IT·运维','知识库迁移窗口通知','迁移权限预计本周三开通，请提前整理目录。'],
    ['老板','月度运营报告延迟说明','报告延期需今天内补发并说明原因。'],
    ['我','给客户发送方案评审议程','已发送评审议程，约定周四下午开会。']
  ];
  var demoProjectIds=Object.create(null);
  function tombstone(item){
    if(item.deleted)return;
    item.deleted=true;
    item.deletedAt=stamp;
    item.updatedAt=stamp;
  }
  (Array.isArray(d.projects)?d.projects:[]).forEach(function(p){
    if(!p)return;
    var matches=demoProjects.some(function(pair){return p.name===pair[0]&&p.nextStep===pair[1];});
    if(matches){
      demoProjectIds[p.id]=true;
      tombstone(p);
    }
  });
  (Array.isArray(d.tasks)?d.tasks:[]).forEach(function(t){
    if(!t)return;
    /* 旧示例及导入记录没有 startDate；在编辑器保存过的任务予以保留。 */
    var untouchedDefaults=t.assignee==='我'&&!t.detail&&!t.category&&!t.prio&&!t.startDate;
    if(untouchedDefaults&&demoTaskTitles.indexOf(t.title)!==-1)tombstone(t);
    /* 用户后建的真实任务不能随示例项目连带删除。 */
    if(!t.deleted&&demoProjectIds[t.projectId]){
      t.projectId='';
      t.updatedAt=stamp;
    }
  });
  (Array.isArray(d.mails)?d.mails:[]).forEach(function(m){
    if(!m)return;
    if(demoMails.some(function(row){return m.from===row[0]&&m.subj===row[1]&&m.snippet===row[2];}))tombstone(m);
  });
  return d;
}

var STORE_KEY='workbench_v1';
var state=load();

function load(){
  var d=null;
  try{var raw=localStorage.getItem(STORE_KEY);if(raw){var parsed=JSON.parse(raw);if(parsed&&Array.isArray(parsed.tasks)&&Array.isArray(parsed.projects))d=parsed;}}catch(e){}
  d=migrate(d||seed());
  try{localStorage.setItem(STORE_KEY,JSON.stringify(d));}catch(e){}
  return d;
}

function now(){return new Date().toISOString();}
function migrate(d){
  d.tasks=Array.isArray(d.tasks)?d.tasks:[];
  d.projects=Array.isArray(d.projects)?d.projects:[];
  d.mails=Array.isArray(d.mails)?d.mails:[];
  cleanLegacyDemo(d);
  d.tasks.concat(d.projects).forEach(function(item){
    if(!item.updatedAt)item.updatedAt=item.createdAt||todayStr();
    if(!item.deleted)ensureItemColors(item);
  });
  d.taskOrder=Array.isArray(d.taskOrder)?d.taskOrder:[];
  delete d.lastBackup;
  d.schemaVersion=2;
  return d;
}

function save(s){ s=s||state; try{localStorage.setItem(STORE_KEY,JSON.stringify(s));}catch(e){}
  // 配置了云端同步时，防抖后自动推送
  var syn=getSync();
  if(syn.gistId&&syn.token){clearTimeout(window._pushT);window._pushT=setTimeout(function(){pushCloud().catch(function(){});},800);}
}

/* ---------- 本地密码锁 ---------- */
function hashPw(s){var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;}return 'h'+h.toString(36);}
function lockOn(){return !!localStorage.getItem('wb_lock');}
function showLock(){
  if(!lockOn())return;
  document.getElementById('lockMask').classList.add('open');
  setTimeout(function(){document.getElementById('lockInput').focus();},100);
}
function tryUnlock(){
  var v=document.getElementById('lockInput').value;
  if(hashPw(v)===localStorage.getItem('wb_lock')){
    document.getElementById('lockMask').classList.remove('open');
    document.getElementById('lockInput').value='';
  }else{
    document.getElementById('lockErr').textContent('密码错误，请重试');
    document.getElementById('lockInput').value='';
  }
}
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&document.getElementById('lockMask').classList.contains('open'))tryUnlock();
});
function setupLock(){
  var p1=document.getElementById('lockNew').value;
  if(p1.length<4){toast('密码至少 4 位');return;}
  localStorage.setItem('wb_lock',hashPw(p1));
  renderers.data(); toast('密码锁已开启，下次打开需输入');
}
function changeLock(){
  var old=document.getElementById('lockOld').value, p1=document.getElementById('lockNew').value;
  if(hashPw(old)!==localStorage.getItem('wb_lock')){toast('原密码错误');return;}
  if(p1.length<4){toast('新密码至少 4 位');return;}
  localStorage.setItem('wb_lock',hashPw(p1));
  renderers.data(); toast('密码已修改');
}
function removeLock(){
  if(!confirm('确定关闭密码锁？'))return;
  localStorage.removeItem('wb_lock'); renderers.data(); toast('密码锁已关闭');
}

/* ================= 自定义壁纸 ================= */
var PRESETS=[
  'linear-gradient(160deg,#eef2f7,#d8e0ec)',
  'linear-gradient(160deg,#e3ede4,#c6d8cc)',
  'linear-gradient(160deg,#f4ece0,#e6d8c2)',
  'linear-gradient(160deg,#e9dde6,#d4bcc9)',
  'linear-gradient(160deg,#1f2a44,#32446b)',
  'linear-gradient(160deg,#1e2f2a,#355046)'
];
function getTheme(){try{return JSON.parse(localStorage.getItem('wb_theme')||'{}');}catch(e){return {};}}
function saveTheme(t){localStorage.setItem('wb_theme',JSON.stringify(t));}
var _wpUrl=null,_wpBlob=null;
function idbOpen(){return new Promise(function(res,rej){
  var r=indexedDB.open('wb_theme',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('kv');};
  r.onsuccess=function(){res(r.result);};
  r.onerror=function(){rej(r.error);};
});}
function idbSet(k,v){return idbOpen().then(function(db){return new Promise(function(res,rej){
  var tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);
  tx.oncomplete=res;tx.onerror=function(){rej(tx.error);};
});});}
function idbGet(k){return idbOpen().then(function(db){return new Promise(function(res,rej){
  var rq=db.transaction('kv').objectStore('kv').get(k);
  rq.onsuccess=function(){res(rq.result);};rq.onerror=function(){rej(rq.error);};
});});}
function idbDel(k){return idbOpen().then(function(db){return new Promise(function(res,rej){
  var tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);
  tx.oncomplete=res;tx.onerror=function(){rej(tx.error);};
});});}
function applyTheme(t){
  t=t||getTheme();
  var root=document.documentElement,bg=document.getElementById('bgLayer'),sh=document.getElementById('bgShade');
  if(_wpUrl){URL.revokeObjectURL(_wpUrl);_wpUrl=null;}
  bg.style.backgroundColor=t.type==='color'&&validColor(t.bgColor)?t.bgColor:'var(--bg)';
  if(t.type==='image'&&_wpBlob){_wpUrl=URL.createObjectURL(_wpBlob);bg.style.backgroundImage='url("'+_wpUrl+'")';}
  else if(t.type==='preset'&&PRESETS[t.preset])bg.style.backgroundImage=PRESETS[t.preset];
  else bg.style.backgroundImage='';
  bg.style.backgroundSize=t.fit==='contain'?'contain':(t.fit==='center'?'auto':'cover');
  bg.style.backgroundRepeat='no-repeat';bg.style.backgroundPosition='center center';
  sh.style.background='rgba(0,0,0,'+((t.overlay==null?20:t.overlay)/100)+')';
  var pa=(t.panel==null?85:t.panel)/100;
  root.style.setProperty('--pa',pa);
  var blurPx=t.blurOn===false?0:(t.blur==null?12:t.blur);
  root.style.setProperty('--blur','blur('+blurPx+'px) saturate(1.2)');
  var light=t.textMode==='light'||(t.textMode==='auto'||!t.textMode)&&!!t.autoLight;
  root.classList.toggle('tl-light',light);
  var lightInk=t.textMode==='custom'&&validColor(t.textColor)?contrastRatio(t.textColor,'#121a28')>=contrastRatio(t.textColor,'#ffffff'):light;
  var surface=lightInk?'18,26,40':'255,255,255';
  root.style.setProperty('--surface-rgb',surface);
  root.style.setProperty('--glass','rgba('+surface+','+Math.min(.6,Math.max(.08,pa*.35))+')');
  root.style.setProperty('--glass-edge',lightInk?'rgba(255,255,255,.22)':'rgba(255,255,255,.48)');
  ['--ink','--ink2','--ink3','--line'].forEach(function(k){root.style.removeProperty(k);});
  if(t.textMode==='custom'&&validColor(t.textColor)){
    root.style.setProperty('--ink',t.textColor);root.style.setProperty('--ink2',t.textColor);root.style.setProperty('--ink3',t.textColor);
    root.style.setProperty('--line',lightInk?'rgba(255,255,255,.3)':'rgba(0,0,0,.16)');
  }
}

function avgBrightness(blob){
  return createImageBitmap(blob).then(function(bmp){
    var cv=document.createElement('canvas');cv.width=32;cv.height=32;
    var ctx=cv.getContext('2d');ctx.drawImage(bmp,0,0,32,32);
    var d=ctx.getImageData(0,0,32,32).data,sum=0;
    for(var i=0;i<d.length;i+=4)sum+=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    bmp.close();
    return sum/(d.length/4)/255;
  });
}
function pickWallpaper(){document.getElementById('wpFile').click();}
var _pendingBlob=null,_pendingUrl=null;
function onWpFile(input){
  var f=input.files&&input.files[0]; input.value='';
  if(!f)return;
  toast('处理中…');
  var preserve=document.getElementById('wpPreserve')&&document.getElementById('wpPreserve').checked;
  var bmp=null;
  createImageBitmap(f).then(function(b){bmp=b;return processImg(bmp,f,preserve);})
  .then(function(blob){
    if(bmp)bmp.close();
    var url=URL.createObjectURL(blob);
    _pendingBlob=blob;_pendingUrl=url;
    openModal('<h3>预览壁纸</h3><img class="wp-preview" src="'+url+'">'+
      '<div class="modal-ops"><button class="btn" onclick="cancelWpPreview()">取消</button>'+
      '<button class="btn primary" onclick="applyWpPreview()">应用此壁纸</button></div>');
  }).catch(function(e){
    if(bmp)try{bmp.close();}catch(_){}
    toast('图片处理失败：'+(e&&e.message||'未知错误'));
  });
}
function cancelWpPreview(){if(_pendingUrl)URL.revokeObjectURL(_pendingUrl);_pendingBlob=null;_pendingUrl=null;closeModal();}
function applyWpPreview(){
  var blob=_pendingBlob,url=_pendingUrl;_pendingBlob=null;_pendingUrl=null;
  closeModal();
  var t=getTheme();t.type='image';
  idbSet('wallpaper',blob).then(function(){return avgBrightness(blob);})
  .then(function(bright){
    t.autoLight=bright<0.5;
    saveTheme(t);_wpBlob=blob;applyTheme(t);renderers.appearance();
    toast('壁纸已应用'+(t.textMode!=='auto'?'':'，已自动切换文字颜色'));
  }).catch(function(){toast('存储空间不足，壁纸未保存');});
  if(url)setTimeout(function(){URL.revokeObjectURL(url);},5000);
}
function processImg(bmp,file,preserve){
  var maxSide=Math.max(bmp.width,bmp.height);
  var limit=preserve?6000:3840;
  if(preserve&&maxSide<=6000&&file.type!=='image/jpeg')return Promise.resolve(file);
  var scale=Math.min(1,limit/maxSide);
  var w=Math.round(bmp.width*scale),h=Math.round(bmp.height*scale);
  var cv=document.createElement('canvas');cv.width=w;cv.height=h;
  cv.getContext('2d').drawImage(bmp,0,0,w,h);
  return new Promise(function(res){cv.toBlob(function(b){res(b);},'image/jpeg',0.9);});
}
function setPreset(i){
  var t=getTheme();t.type='preset';t.preset=i;t.autoLight=i>=4;saveTheme(t);
  idbDel('wallpaper').catch(function(){});_wpBlob=null;
  applyTheme(t);renderers.appearance();toast('已应用预设背景');
}
function resetAppearance(){
  saveTheme({});_wpBlob=null;
  idbDel('wallpaper').catch(function(){});
  applyTheme({});renderers.appearance();toast('已恢复默认外观');
}
function sliderLive(id,wvId,field){
  var el=document.getElementById(id),wv=document.getElementById(wvId);
  if(!el)return;
  el.oninput=function(){
    if(wv)wv.textContent=el.value;
    var t=getTheme();t[field]=+el.value;saveTheme(t);applyTheme(t);
  };
}
function textModeChange(){
  var v=document.getElementById('wpText').value;
  var t=getTheme();t.textMode=v;saveTheme(t);applyTheme(t);
}
function blurToggle(){
  var on=document.getElementById('wpBlurOn').checked;
  var t=getTheme();t.blurOn=on;saveTheme(t);applyTheme(t);
}
function fitChange(){
  var v=document.getElementById('wpFit').value;
  var t=getTheme();t.fit=v;saveTheme(t);applyTheme(t);
}

/* ---------- 云端同步（GitHub Gist） ---------- */
function getSync(){try{return JSON.parse(localStorage.getItem('wb_sync')||'{}');}catch(e){return {};}}
function setSync(o){localStorage.setItem('wb_sync',JSON.stringify(o));}
function pushCloud(){
  var syn=getSync(); if(!syn.gistId||!syn.token)return Promise.resolve();
  return pullCloud()
    .then(function(remote){mergeRemote(remote);})            // 先并入云端独有数据
    .then(function(){
      var body=JSON.stringify({files:{'workbench.json':{content:JSON.stringify(state)}}});
      return fetch('https://api.github.com/gists/'+syn.gistId,{method:'PATCH',headers:{'Authorization':'token '+syn.token,'Content-Type':'application/json'},body:body});
    })
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);})
    .then(function(){localStorage.setItem('wb_sync_at',new Date().toLocaleString('zh-CN'));});
}
function pullCloud(){
  var syn=getSync(); if(!syn.gistId||!syn.token)return Promise.resolve(null);
  return fetch('https://api.github.com/gists/'+syn.gistId,{headers:{'Authorization':'token '+syn.token}})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(g){var f=g.files&&g.files['workbench.json']; return f?JSON.parse(f.content):null;});
}
// 按 id 逐条合并：updatedAt 较新的一方为准；软删除墓碑随同步传播，旧数据不得复活已删项
function mergeById(localList, remoteList){
  var map={}; localList.forEach(function(x){map[x.id]=x;});
  (remoteList||[]).forEach(function(r){
    var l=map[r.id];
    if(!l){map[r.id]=r;}
    else if((r.updatedAt||'')>(l.updatedAt||'')){map[r.id]=r;}
  });
  return Object.keys(map).map(function(k){return map[k];});
}
function mergeRemote(remote){
  if(!remote||!Array.isArray(remote.tasks))return 0;
  remote=migrate(remote);
  var before=state.tasks.length+state.projects.length;
  state.tasks=mergeById(state.tasks,remote.tasks);
  state.projects=mergeById(state.projects,remote.projects);
  if((remote.taskOrderUpdatedAt||'')>(state.taskOrderUpdatedAt||'')){
    state.taskOrder=remote.taskOrder;state.taskOrderUpdatedAt=remote.taskOrderUpdatedAt;
  }
  migrate(state);
  return (state.tasks.length+state.projects.length)-before;
}

function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ---------- 日期工具 ---------- */
function dstr(d){var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+dd;}
function today(){return new Date();}
function todayStr(){return dstr(today());}
function offsetDate(n){var d=new Date();d.setDate(d.getDate()+n);return dstr(d);}
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function dayDiff(a,b){return Math.round((parseD(a)-parseD(b))/86400000);} // a-b 天数
function fmtCn(s){var p=s.split('-');return (+p[1])+'月'+(+p[2])+'日';}
function weekRange(){ // 本周周一~周日
  var t=today(), dow=(t.getDay()+6)%7; // 周一=0
  var mon=new Date(t); mon.setDate(t.getDate()-dow);
  var sun=new Date(mon); sun.setDate(mon.getDate()+6);
  return {mon:dstr(mon),sun:dstr(sun)};
}
function relDue(s){ // 截止日相对今天的描述
  var diff=dayDiff(s,todayStr());
  if(diff===0) return '今天';
  if(diff===-1) return '昨天';
  if(diff===1) return '明天';
  if(diff<0) return '已延期'+(-diff)+'天';
  return '剩'+diff+'天';
}

/* ---------- 初始数据：空工作台 ---------- */
function seed(){return {projects:[],tasks:[],mails:[],taskOrder:[],taskOrderUpdatedAt:''};}

/* ---------- 派生数据 ---------- */
function projById(id){for(var i=0;i<state.projects.length;i++)if(state.projects[i].id===id)return state.projects[i];return null;}
function openTasks(){return state.tasks.filter(function(t){return !t.done&&!t.deleted;});}
function overdueTasks(){return openTasks().filter(function(t){return dayDiff(t.due,todayStr())<0;});}
function dueTodayTasks(){return openTasks().filter(function(t){return t.due===todayStr();});}
function waitingTasks(){return openTasks().filter(function(t){return t.waiting;});}
function doneTodayTasks(){return state.tasks.filter(function(t){return t.done&&t.doneAt===todayStr()&&!t.deleted;});}
function projStats(p){
  var all=state.tasks.filter(function(t){return t.projectId===p.id&&!t.deleted;});
  var done=all.filter(function(t){return t.done;}).length;
  return {total:all.length,done:done,left:all.length-done};
}
function projStatus(p){
  var s=projStats(p);
  if(p.persistent) return 'ongoing'; // 持续跟进类项目（如工时测量），不自动判完成
  if(s.left===0&&s.total>0) return 'done';
  if(p.blocked) return 'blocked';
  var diff=dayDiff(p.deadline,todayStr());
  if(diff<0) return 'overdue';
  if(diff<=3) return 'due';
  return 'ok';
}
var STATUS_MAP={
  ok:{label:'正常',cls:'green'},
  due:{label:'临期',cls:'amber'},
  overdue:{label:'已超期',cls:'red'},
  blocked:{label:'阻塞',cls:'red'},
  ongoing:{label:'持续中',cls:'brand'},
  done:{label:'已完成',cls:'green'}
};
var PRIO_MAP={
  p1:{label:'重要紧急',cls:'red'},
  p2:{label:'重要不紧急',cls:'brand'},
  p3:{label:'不重要紧急',cls:'amber'},
  p4:{label:'不重要不紧急',cls:''}
};
// 截止日期相同时的优先级顺序（用户指定）：重要紧急 > 不重要紧急 > 重要不紧急 > 不重要不紧急
var PRIO_ORDER={p1:0,p3:1,p2:2,p4:3,'':4};
function sortTasks(list){
  return list.slice().sort(function(a,b){
    if(a.due!==b.due) return a.due<b.due?-1:1; // 截止越近越靠前
    var pa=PRIO_ORDER[a.prio||'']==null?4:PRIO_ORDER[a.prio||''];
    var pb=PRIO_ORDER[b.prio||'']==null?4:PRIO_ORDER[b.prio||''];
    return pa-pb;
  });
}
function prioChip(t){
  if(t.prio&&PRIO_MAP[t.prio]) return '<span class="chip '+PRIO_MAP[t.prio].cls+'">'+PRIO_MAP[t.prio].label+'</span>';
  return '<span class="chip">未分级</span>';
}

/* ================= 图标与导航 ================= */
var ICONS={
  appearance:'<rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.5"/><path d="M3 16l5-5 4 4 3-3 6 6"/>',

function buildNav(){
  var s='',t='';
  ROUTES.forEach(function(r){
    s+='<button class="nav-item" data-r="'+r.id+'">'+icon(r.icon)+'<span>'+r.name+'</span></button>';
    t+='<button class="tab" data-r="'+r.id+'">'+icon(r.icon,20)+'<span>'+r.name+'</span></button>';
  });
  document.getElementById('sideNav').innerHTML=s;
  document.getElementById('tabbar').innerHTML=t;
  document.querySelectorAll('[data-r]').forEach(function(el){
    el.addEventListener('click',function(){location.hash=el.getAttribute('data-r');});
  });

function route(){
  cancelTaskSelection();cancelTaskDrag();
  var h=(location.hash||'#home').slice(1);
  if(!TITLES[h]) h='home';
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});
  document.getElementById('view-'+h).classList.add('active');
  document.querySelectorAll('[data-r]').forEach(function(el){
    el.classList.toggle('active',el.getAttribute('data-r')===h);
  });
  document.getElementById('topTitle').textContent=TITLES[h];
  renderers[h]();
  window.scrollTo(0,0);
}

/* ================= 通用小部件 ================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(function(){el.classList.remove('show');},1800);
}
function openModal(html){
  var box=document.getElementById('modalBox');box.classList.remove('item-colored');box.removeAttribute('style');box._colors=null;
  document.getElementById('modalBox').innerHTML=html;
  document.getElementById('mask').classList.add('open');
}
function closeModal(){document.getElementById('mask').classList.remove('open');if(_pendingUrl){URL.revokeObjectURL(_pendingUrl);_pendingUrl=null;_pendingBlob=null;}}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
document.getElementById('mask').addEventListener('click',function(e){if(e.target===this)closeModal();});

function taskRow(t,showProj,sortable){
  var p=projById(t.projectId);
  var chips='';
  if(t.due) chips+='<span class="chip '+(dayDiff(t.due,todayStr())<0?'red':(t.due===todayStr()?'amber':''))+'">'+relDue(t.due)+'</span>';
  if(t.category) chips+='<span class="chip brand">'+esc(t.category)+'</span>';
  if(t.prio&&PRIO_MAP[t.prio]) chips+='<span class="chip '+PRIO_MAP[t.prio].cls+'">'+PRIO_MAP[t.prio].label+'</span>';
  if(t.focus) chips+='<span class="chip brand">重点</span>';
  if(t.waiting) chips+='<span class="chip">等待他人</span>';
  if(showProj&&p) chips+='<span class="chip">'+esc(p.name)+'</span>';
  if(t.assignee) chips+='<span class="chip">'+esc(t.assignee)+'</span>';
  var detail=t.detail?'<div class="muted" style="font-size:12.5px;margin-top:3px;word-break:break-word">'+esc(t.detail)+'</div>':'';
  return '<div class="task item-colored '+(t.done?'done':'')+'" data-id="'+t.id+'" data-task-id="'+t.id+'" style="'+itemStyle(t)+'">'+
    (sortable?'<button type="button" class="drag-handle" aria-label="拖动排序：'+esc(t.title)+'" title="拖动排序；键盘上下键移动">⠿</button><input type="checkbox" class="task-selection" data-select-id="'+t.id+'" aria-label="选择任务：'+esc(t.title)+'"'+(selectedTaskIds.has(t.id)?' checked':'')+' onchange="selectOneTask(this.dataset.selectId,this.checked)">':'')+
    '<button class="check '+(t.done?'done':'')+'" aria-label="'+(t.done?'恢复任务':'完成任务')+'：'+esc(t.title)+'" aria-pressed="'+!!t.done+'" onclick="toggleDone(\''+t.id+'\')"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'+
    '<div class="task-body"><div class="task-title">'+esc(t.title)+'</div>'+detail+'<div class="task-meta">'+chips+'</div></div>'+
    '<div class="task-ops">'+
      '<button class="iconbtn" title="改期" onclick="reschedule(\''+t.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>'+
      '<button class="iconbtn" title="编辑" onclick="openTaskModal(\''+t.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>'+
    '</div></div>';
}
function toggleDone(id){
  var t=state.tasks.find(function(x){return x.id===id;});
  if(!t)return;
  t.done=!t.done; t.doneAt=t.done?todayStr():null; t.updatedAt=now();
  save(); renderAll(); toast(t.done?'已完成，干得漂亮':'已恢复为未完成');
}
function reschedule(id){
  var t=state.tasks.find(function(x){return x.id===id;});
  if(!t)return;
  openModal('<h3>改期：'+esc(t.title)+'</h3>'+
    '<div class="field"><label>新的截止日期</label><input type="date" id="rsDate" value="'+t.due+'"></div>'+
    '<div class="modal-ops"><button class="btn" onclick="closeModal()">取消</button>'+
    '<button class="btn primary" onclick="doReschedule(\''+id+'\')">保存</button></div>');

function doReschedule(id){
  var v=document.getElementById('rsDate').value;
  var t=state.tasks.find(function(x){return x.id===id;});
  if(t&&v){t.due=v; t.updatedAt=now(); save(); renderAll(); toast('已改期为 '+fmtCn(v));}
  closeModal();
}

function saveTask(id){
  var title=document.getElementById('fTitle').value.trim();
  if(!title){toast('请填写任务名称');return;}
  var data={
    title:title,
    projectId:document.getElementById('fProj').value,
    category:document.getElementById('fCate').value,
    startDate:document.getElementById('fStart').value||todayStr(),
    due:document.getElementById('fDue').value||todayStr(),
    prio:document.getElementById('fPrio').value,
    detail:document.getElementById('fDetail').value.trim(),
    assignee:document.getElementById('fAssignee').value.trim()||'我',
    waiting:document.getElementById('fWait').value==='1',
    waitSince:document.getElementById('fWait').value==='1'?todayStr():null,
    focus:document.getElementById('fFocus').checked,
    updatedAt:now()
  };
  Object.assign(data,modalColors());
  if(id){
    var t=state.tasks.find(function(x){return x.id===id;});
    Object.assign(t,data);
  }else{
    var task=Object.assign({id:uid(),done:false,doneAt:null,createdAt:todayStr()},data);
    state.tasks.push(task);if(state.taskOrder.length){state.taskOrder.push(task.id);state.taskOrderUpdatedAt=now();}
  }
  save(); renderAll(); closeModal(); toast(id?'已保存':'任务已添加');
}
function delTask(id){
  var t=state.tasks.find(function(x){return x.id===id;});
  if(t){t.deleted=true; t.deletedAt=now(); t.updatedAt=now();}
  save(); renderAll(); closeModal(); toast('任务已删除（将同步到另一端）');
}

function renderHome(){

  // 最重要3件事：先按截止日期近→前，同日按重要程度（重要紧急>不重要紧急>重要不紧急>不重要不紧急）

    h+='<div class="focus-item f'+(i+1)+'"><div class="focus-no">'+(i+1)+'</div><div class="task-body">'+
      '<div class="task-title">'+esc(t.title)+'</div><div class="task-meta">'+
      '<span class="chip '+(dayDiff(t.due,todayStr())<0?'red':(t.due===todayStr()?'amber':''))+'">'+relDue(t.due)+'</span>'+
      prioChip(t)+
      (t.focus?'<span class="chip brand">重点</span>':'')+'</div></div>'+
      '<button class="iconbtn" onclick="toggleDone(\''+t.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6L9 17l-5-5"/></svg></button></div>';
  });
  h+='</div>';

  function col(title,list,cls){
    var c='<div class="card"><div class="card-h"><h3>'+title+'</h3><span class="chip '+cls+'">'+list.length+'</span></div>';
    if(!list.length) c+='<div class="empty">暂无</div>';

  h+='<div class="grid cols-2" style="margin-top:14px">'+

    col('已延期',od,'red')+

  document.getElementById('view-home').innerHTML=h;

function renderProjects(){
  var h='<div class="project-toolbar">'+
    '<span class="muted">共 '+state.projects.filter(function(p){return !p.deleted;}).length+' 个项目 · 超期或 3 天内到期自动标红</span>'+
    '<button class="btn sm" id="deckToggle" onclick="toggleProjectDeck()" aria-expanded="false">展开卡片</button><button class="btn sm primary" onclick="openProjModal()">＋ 新项目</button></div>';

  h+='<div id="projectDeck" class="project-deck">';

      '<div class="muted" style="margin-top:5px;font-size:12px">进度 '+pct+'% · 未完 '+s.left+' / '+s.total+' 项</div></div>'+
      '<div class="proj-next">下一步：'+esc(p.nextStep||'—')+'</div>'+

  h+='</div>';

  layoutProjectDeck();

function openProjModal(id){
  var p=id?state.projects.find(function(x){return x.id===id;}):null;
  var colors=p?ensureItemColors(p):randomColors();
  openModal('<h3>'+(p?'编辑项目':'新建项目')+'</h3>'+colorFields(colors)+

    '<div class="row2">'+
    '<div class="field"><label>交付截止</label><input type="date" id="pDue" value="'+(p?p.deadline:offsetDate(14))+'"></div>'+
    '<div class="field"><label>状态</label><select id="pStatus">'+
    '<option value="ok"'+(!(p&&(p.blocked||p.persistent))?' selected':'')+'>正常</option>'+
    '<option value="blocked"'+(p&&p.blocked?' selected':'')+'>阻塞</option>'+
    '<option value="ongoing"'+(p&&p.persistent?' selected':'')+'>持续中（长期跟进，不算完成）</option>'+

function saveProj(id){
  var name=document.getElementById('pName').value.trim();
  if(!name){toast('请填写项目名称');return;}
  var st=document.getElementById('pStatus').value;
  var data={name:name,deadline:document.getElementById('pDue').value||offsetDate(14),
    blocked:st==='blocked',persistent:st==='ongoing',nextStep:document.getElementById('pNext').value.trim(),updatedAt:now()};
  Object.assign(data,modalColors());
  if(id){Object.assign(state.projects.find(function(x){return x.id===id;}),data);}
  else{state.projects.push(Object.assign({id:uid(),createdAt:todayStr()},data));}
  save(); renderAll(); closeModal(); toast(id?'项目已保存':'项目已创建');
}
function delProj(id){
  var p=state.projects.find(function(x){return x.id===id;});
  if(p){p.deleted=true; p.deletedAt=now(); p.updatedAt=now();}
  state.tasks.forEach(function(t){if(t.projectId===id&&!t.deleted){t.deleted=true; t.deletedAt=now(); t.updatedAt=now();}});
  save(); renderAll(); closeModal(); toast('项目及关联任务已删除（将同步到另一端）');
}
function toggleBlock(id){
  var p=state.projects.find(function(x){return x.id===id;});
  if(p){p.blocked=!p.blocked; p.updatedAt=now(); save(); renderAll(); toast(p.blocked?'已标记阻塞':'已恢复正常');}
}

  // 1 过期未完
  var od=overdueTasks();
  rows.push({sev:od.length?'red':'green',title:'过期未完任务',desc:od.length?od.map(function(t){return t.title+'（延期'+-dayDiff(t.due,todayStr())+'天）';}).join('、'):'当前没有过期任务',cnt:od.length});
  // 2 24h内截止
  var d24=openTasks().filter(function(t){var d=dayDiff(t.due,todayStr());return d===0;});
  rows.push({sev:d24.length?'amber':'green',title:'24 小时内截止',desc:d24.length?d24.map(function(t){return t.title;}).join('、'):'今天没有临期任务',cnt:d24.length});
  // 3 3天内未交付项目
  var dueP=state.projects.filter(function(p){var d=dayDiff(p.deadline,todayStr());return !p.deleted&&d>=0&&d<=3&&projStatus(p)!=='done';});
  rows.push({sev:dueP.length?'amber':'green',title:'3 天内需交付项目',desc:dueP.length?dueP.map(function(p){return p.name+'（剩'+dayDiff(p.deadline,todayStr())+'天）';}).join('、'):'近期无临期项目',cnt:dueP.length});
  // 4 手动阻塞项目
 var blk=state.projects.filter(function(p){return !p.deleted&&p.blocked;});
  rows.push({sev:blk.length?'red':'green',title:'手动阻塞项目',desc:blk.length?blk.map(function(p){return p.name+'：'+(p.nextStep||'待解除阻塞');}).join('、'):'没有阻塞中的项目',cnt:blk.length});
  // 5 等待超3天
  var wt=waitingTasks().filter(function(t){return t.waitSince&&dayDiff(todayStr(),t.waitSince)>=3;});
  rows.push({sev:wt.length?'red':'green',title:'等待他人超 3 天',desc:wt.length?wt.map(function(t){return t.title+'（已等'+dayDiff(todayStr(),t.waitSince)+'天）';}).join('、'):'等待中的事项都在 3 天内',cnt:wt.length});
  return rows;
}

function weekStats(){
  var wr=weekRange();
  var all=state.tasks;
  var all=state.tasks.filter(function(t){return !t.deleted;});
  var created=all.filter(function(t){return t.createdAt>=wr.mon&&t.createdAt<=wr.sun;});
  var doneW=all.filter(function(t){return t.done&&t.doneAt&&t.doneAt>=wr.mon&&t.doneAt<=wr.sun;});
  var left=openTasks();
  var total=doneW.length+left.length;
  var rate=total?Math.round(doneW.length/total*100):0;
  return {wr:wr,created:created.length,done:doneW.length,left:left.length,rate:rate,doneList:doneW,leftList:left};
}
function renderReview(){
  var s=weekStats();
  var C=2*Math.PI*52, off=C*(1-s.rate/100);
  var h='<div class="card"><div class="card-h"><h3>本周概览（'+fmtCn(s.wr.mon)+' — '+fmtCn(s.wr.sun)+'）</h3></div>'+

      '<text x="60" y="66" text-anchor="middle" class="pct" font-size="22" font-weight="700" fill="#171A21">'+s.rate+'%</text>'+

      '<div class="stat red"><div class="n">'+s.left+'</div><div class="l">当前未完</div></div>'+

  h+=s.doneList.length?s.doneList.map(function(t){return '<div class="task"><div class="task-body"><div class="task-title">'+esc(t.title)+'</div><div class="task-meta"><span class="chip green">完成于 '+fmtCn(t.doneAt)+'</span></div></div></div>';}).join(''):'<div class="empty">本周还没有完成记录</div>';

  h+='</div></div>';

  h+='<div style="margin-top:14px"><button class="btn primary" style="width:100%" onclick="genReport()">整理本周周报</button></div>';

function genReport(){
  var s=weekStats();
  var projs=state.projects.filter(function(p){return !p.deleted&&projStatus(p)!=='done';});
  var risks=riskRows().filter(function(r){return r.cnt>0;});
  var lines=[];
  lines.push('【本周工作周报】');
  lines.push('周期：'+fmtCn(s.wr.mon)+' — '+fmtCn(s.wr.sun));
  lines.push('');
  lines.push('一、本周完成（'+s.done+' 项）');
  if(s.doneList.length)s.doneList.forEach(function(t,i){lines.push((i+1)+'. '+t.title);});
  else lines.push('（暂无）');
  lines.push('');
  lines.push('二、进行中项目');
  if(projs.length)projs.forEach(function(p){lines.push('· '+p.name+'：'+(p.nextStep||'推进中'));});
  else lines.push('（无）');
  lines.push('');
  lines.push('三、风险与阻塞');
  if(risks.length)risks.forEach(function(r){lines.push('· '+r.title+'：'+r.cnt+' 项');});
  else lines.push('（无）');
  lines.push('');
  lines.push('四、未完事项（'+s.left+' 项）');
  if(s.leftList.length)s.leftList.slice(0,8).forEach(function(t,i){lines.push((i+1)+'. '+t.title+'（截止 '+fmtCn(t.due)+'）');});
  else lines.push('（无）');
  lines.push('');
  lines.push('五、下周重点');
  var top=openTasks().slice().sort(function(a,b){return a.due<b.due?-1:1;}).slice(0,3);
  top.forEach(function(t,i){lines.push((i+1)+'. '+t.title);});
  var txt=lines.join('\n');
  openModal('<h3>本周周报草稿</h3><div class="copybox" id="reportBox">'+esc(txt)+'</div>'+
    '<div class="modal-ops"><button class="btn" onclick="closeModal()">关闭</button>'+
    '<button class="btn primary" onclick="copyReport()">复制全文</button></div>');
}
function copyReport(){
  var txt=document.getElementById('reportBox').innerText;
  function done(){toast('已复制，可粘贴到钉钉/邮件');}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt,done);});}
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,cb){
  var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);cb();
}

function createGist(){
  var tok=(document.getElementById('syncToken').value||'').trim();
  if(!tok){toast('请先粘贴 GitHub Token');return;}
  fetch('https://api.github.com/gists',{method:'POST',headers:{'Authorization':'token '+tok,'Content-Type':'application/json'},body:JSON.stringify({description:'业务工作台同步数据',public:false,files:{'workbench.json':{content:JSON.stringify(state)}}})})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(function(g){setSync({gistId:g.id,token:tok});localStorage.setItem('wb_sync_at',new Date().toLocaleString('zh-CN'));renderers.data();toast('同步仓库已创建，已自动上传本机数据');})
  .catch(function(e){toast('创建失败：'+e.message);});
}
function connectGist(){
  var tok=(document.getElementById('syncToken').value||'').trim();
  var gid=prompt('粘贴同步仓库 ID（在已连接的设备上可看到）：');
  if(!gid){return;}
  setSync({gistId:gid.trim(),token:tok});
  pullCloud().then(function(remote){
    var n=mergeRemote(remote);
    localStorage.setItem(STORE_KEY,JSON.stringify(state));
    renderAll(); toast(n>0?('已连接，从云端并入 '+n+' 条'):'已连接，云端暂无新数据');
  }).catch(function(e){toast('连接失败：'+e.message+'（多为手机网络访问 GitHub 超时）');});
}
function manualPull(){
  pullCloud().then(function(remote){
    var n=mergeRemote(remote);
    localStorage.setItem(STORE_KEY,JSON.stringify(state));
    renderAll(); toast(n>0?('已并入云端 '+n+' 条数据'):'云端无新数据');
  }).catch(function(e){toast('拉取失败：'+e.message);});
}
function manualPush(){
  pushCloud().then(function(){localStorage.setItem('wb_sync_at',new Date().toLocaleString('zh-CN'));renderers.data();toast('已上传云端');})
  .catch(function(e){toast('上传失败：'+e.message);});
}
function disconnectSync(){
  if(!confirm('断开后本设备不再自动同步，确定？'))return;
  localStorage.removeItem('wb_sync'); renderers.data(); toast('已断开');
}

function importMail(scope){
  var wr=weekRange();
  var d=today(); var endM=dstr(new Date(d.getFullYear(),d.getMonth()+1,0));
  var due=scope==='today'?todayStr():(scope==='week'?wr.sun:endM);
  var added=0;
  state.mails.filter(function(m){return !m.deleted&&m.folder==='inbox'&&m.todo;}).forEach(function(m){
    if(state.tasks.some(function(t){return !t.deleted&&(t.sourceMailId===m.id||t.title===m.todo&&t.due===due);}))return;
    var task=Object.assign({id:uid(),title:m.todo,sourceMailId:m.id,projectId:'',due:due,assignee:'我',done:false,doneAt:null,createdAt:todayStr(),updatedAt:now(),focus:false,waiting:false,waitSince:null},randomColors());
    state.tasks.push(task);if(state.taskOrder.length){state.taskOrder.push(task.id);state.taskOrderUpdatedAt=now();}
    added++;
  });
  save(); renderAll(); toast(added?'已导入 '+added+' 封邮件相关待办（截止 '+fmtCn(due)+'）':'没有可导入的邮件动作');
}

var renderers={home:renderHome,projects:renderProjects,tasks:renderTasks,risks:renderRisks,review:renderReview,data:renderData,mail:renderMail,appearance:renderAppearance,info:renderInfo};
function renderAll(){var h=(location.hash||'#home').slice(1); renderers[h in renderers?h:'home']();}
function init(){

      localStorage.setItem(STORE_KEY,JSON.stringify(state)); route();

}
/* ================= 持久配色：从完整 RGB 色域抽样，文字对比度至少 4.5 ================= */
function validColor(c){return typeof c==='string'&&/^#[0-9a-f]{6}$/i.test(c);}
function colorLuminance(c){
  var rgb=[1,3,5].map(function(i){var v=parseInt(c.slice(i,i+2),16)/255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);});
  return rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722;
}
function contrastRatio(a,b){var x=colorLuminance(a),y=colorLuminance(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
function randomHex(){var a=new Uint8Array(3);crypto.getRandomValues(a);return '#'+Array.from(a,function(v){return v.toString(16).padStart(2,'0');}).join('');}
function readableInk(bg){
  for(var i=0;i<300;i++){var ink=randomHex();if(contrastRatio(bg,ink)>=4.5)return ink;}
  return contrastRatio(bg,'#000000')>=contrastRatio(bg,'#ffffff')?'#000000':'#ffffff';
}
function randomColors(){var bg=randomHex();return {bgColor:bg,textColor:readableInk(bg)};}
function ensureItemColors(item){
  // 旧记录按 id 补色，避免不同设备迁移时得到不同背景。
  if(!validColor(item.bgColor)){var hash=2166136261;String(item.id||'item').split('').forEach(function(c){hash=Math.imul(hash^c.charCodeAt(0),16777619);});item.bgColor='#'+(hash>>>0).toString(16).padStart(8,'0').slice(-6);}
  if(!validColor(item.textColor)||contrastRatio(item.bgColor,item.textColor)<4.5){item.textColor=contrastRatio(item.bgColor,'#000000')>=contrastRatio(item.bgColor,'#ffffff')?'#000000':'#ffffff';}
  return item;
}
function itemStyle(item){ensureItemColors(item);return '--item-bg:'+item.bgColor+';--item-ink:'+item.textColor+';--item-scheme:'+(colorLuminance(item.bgColor)<.2?'dark':'light');}
function colorFields(item){return '<div class="color-fields"><label class="color-label">背景<input type="color" id="itemBg" value="'+item.bgColor+'" oninput="changeItemColor(\'background\')"></label><label class="color-label">文字<input type="color" id="itemInk" value="'+item.textColor+'" oninput="changeItemColor(\'text\')"></label><button class="btn sm" type="button" onclick="rerollItemColors()">随机配色</button><span class="color-code" id="colorRatio"></span></div>';}
function applyModalColors(item){var box=document.getElementById('modalBox');box.classList.add('item-colored');box.style.cssText=itemStyle(item);box._colors={bgColor:item.bgColor,textColor:item.textColor};updateColorRatio();}
function updateColorRatio(){var el=document.getElementById('colorRatio'),box=document.getElementById('modalBox');if(el&&box._colors)el.textContent='对比度 '+contrastRatio(box._colors.bgColor,box._colors.textColor).toFixed(2)+' : 1';}
function changeItemColor(which){
  var bg=document.getElementById('itemBg').value,ink=document.getElementById('itemInk').value;
  if(contrastRatio(bg,ink)<4.5){
    if(which==='text'){document.getElementById('itemInk').value=document.getElementById('modalBox')._colors.textColor;toast('文字与背景太接近，请选择更醒目的颜色');return;}
    ink=readableInk(bg);document.getElementById('itemInk').value=ink;
  }
  applyModalColors({bgColor:bg,textColor:ink});
}
function rerollItemColors(){var c=randomColors();document.getElementById('itemBg').value=c.bgColor;document.getElementById('itemInk').value=c.textColor;applyModalColors(c);}
function modalColors(){return document.getElementById('modalBox')._colors||randomColors();}

/* ================= 任务批量选择：与完成状态分开 ================= */
var selectedTaskIds=new Set(),_selectionRun=0;
function getVisibleTasks(){
  var list=state.tasks.filter(function(t){return !t.deleted;});
  if(!state.taskOrder||!state.taskOrder.length)return sortTasks(list.filter(function(t){return !t.done;})).concat(list.filter(function(t){return t.done;}).reverse());
  var ranks=new Map(state.taskOrder.map(function(id,i){return [id,i];}));
  return list.sort(function(a,b){return (ranks.has(a.id)?ranks.get(a.id):100000)-(ranks.has(b.id)?ranks.get(b.id):100000);});
}
function syncSelectionUI(){
  var list=getVisibleTasks(),ids=new Set(list.map(function(t){return t.id;}));
  selectedTaskIds.forEach(function(id){if(!ids.has(id))selectedTaskIds.delete(id);});
  var button=document.getElementById('selectAllTasks'),status=document.getElementById('selectionStatus');
  if(button){button.textContent=list.length&&list.every(function(t){return selectedTaskIds.has(t.id);})?'取消全选':'全选';button.disabled=!list.length;button.setAttribute('aria-pressed',list.length>0&&list.every(function(t){return selectedTaskIds.has(t.id);})?'true':'false');}
  if(status)status.textContent='已选 '+selectedTaskIds.size+' 项';
  document.querySelectorAll('[data-batch-action]').forEach(function(el){el.disabled=!selectedTaskIds.size;});
}
function selectOneTask(id,checked){_selectionRun++;if(checked)selectedTaskIds.add(id);else selectedTaskIds.delete(id);syncSelectionUI();}
function cancelTaskSelection(){_selectionRun++;}
async function toggleSelectAllTasks(){
  var list=getVisibleTasks(),deselect=list.length&&list.every(function(t){return selectedTaskIds.has(t.id);}),run=++_selectionRun;
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  for(var i=0;i<list.length;i++){
    if(run!==_selectionRun||location.hash!=='#tasks')break;
    var t=list[i],input=Array.from(document.querySelectorAll('#taskList .task-selection')).find(function(el){return el.dataset.selectId===t.id;});
    if(!input)continue;
    if(deselect)selectedTaskIds.delete(t.id);else selectedTaskIds.add(t.id);
    input.checked=!deselect;
    if(!reduced){input.animate([{transform:'scale(1)'},{transform:'scale(1.25)',offset:.5},{transform:'scale(.95)',offset:.8},{transform:'scale(1)'}],{duration:300,easing:'ease-out'});}
    syncSelectionUI();
    if(!reduced)await new Promise(function(resolve){setTimeout(resolve,65);});
  }
  if(run===_selectionRun)syncSelectionUI();
}
function batchCompleteTasks(){
  cancelTaskSelection();var count=0;
  state.tasks.forEach(function(t){if(!t.deleted&&selectedTaskIds.has(t.id)&&!t.done){t.done=true;t.doneAt=todayStr();t.updatedAt=now();count++;}});
  selectedTaskIds.clear();save();renderAll();toast('已完成 '+count+' 项任务');
}
function batchDeleteTasks(){
  if(!selectedTaskIds.size||!confirm('删除选中的 '+selectedTaskIds.size+' 项任务？'))return;
  cancelTaskSelection();state.tasks.forEach(function(t){if(selectedTaskIds.has(t.id)&&!t.deleted){t.deleted=true;t.deletedAt=now();t.updatedAt=now();}});
  selectedTaskIds.clear();save();renderAll();toast('选中任务已删除');
}

/* ================= 壁纸与全局文字拾色器 ================= */
function setWallpaperColor(value){
  if(!validColor(value))return;
  var t=getTheme();t.type='color';t.bgColor=value;t.autoLight=colorLuminance(value)<.25;saveTheme(t);applyTheme(t);

/* ================= 任务拖拽与项目叠卡 ================= */
var _taskDrag = null;
var _deckExpanded = false;
var _deckFrame = 0;
var _deckObserver = null;
var _deckStates = new Map();
function reducedMotion(){return window.matchMedia('(prefers-reduced-motion: reduce)').matches;}

function commitTaskOrder(ids){
  var visible=new Set(ids), existing=Array.isArray(state.taskOrder)?state.taskOrder:[];
  var all=existing.filter(function(id){return !visible.has(id)&&state.tasks.some(function(t){return t.id===id;});});
  state.taskOrder=ids.concat(all);
  state.tasks.forEach(function(t){if(state.taskOrder.indexOf(t.id)<0)state.taskOrder.push(t.id);});
  state.taskOrderUpdatedAt=new Date().toISOString();
  save();
}
function taskDragCleanup(d){
  if(!d)return;
  cancelAnimationFrame(d.frame);
  document.removeEventListener('pointermove',taskPointerMove);
  document.removeEventListener('pointerup',taskPointerUp);
  document.removeEventListener('pointercancel',taskPointerCancel);
  document.removeEventListener('keydown',taskDragEscape);
  try{if(d.handle.hasPointerCapture(d.pointerId))d.handle.releasePointerCapture(d.pointerId);}catch(e){}
  document.body.classList.remove('task-dragging');
  d.list.classList.remove('is-sorting','is-settling');
  d.rows.forEach(function(r){r.el.style.transform='';r.el.classList.remove('is-dragged');});
  d.handle.setAttribute('aria-pressed','false');
  if(_taskDrag===d)_taskDrag=null;
}
function cancelTaskDrag(){
  var d=_taskDrag;if(!d)return;
  // 松手后的排序已经确认；切换页面时也保留这个结果。
  if(d.phase==='settle'&&d.changed)commitTaskOrder(d.order.map(function(r){return r.id;}));
  taskDragCleanup(d);
}
function taskDragEscape(e){if(e.key==='Escape'){e.preventDefault();taskDragCleanup(_taskDrag);}}
function initTaskSorting(){
  cancelTaskDrag();
  var list=document.getElementById('taskList');
  if(!list||list.dataset.sortingBound)return;
  list.dataset.sortingBound='1';
  list.addEventListener('pointerdown',function(e){
    var handle=e.target.closest('.drag-handle');
    if(!handle||!list.contains(handle)||e.button!==0||e.isPrimary===false)return;
    var row=handle.closest('.task[data-task-id]');
    if(!row||list.children.length<2)return;
    e.preventDefault();
    var elements=Array.from(list.querySelectorAll(':scope > .task[data-task-id]'));
    var listTop=list.getBoundingClientRect().top+window.scrollY;
    var rows=elements.map(function(el){var r=el.getBoundingClientRect();return {el:el,id:el.dataset.taskId,top:r.top+window.scrollY-listTop,height:r.height,x:0,v:0,target:0};});
    var dragged=rows.find(function(r){return r.el===row;});
    if(!dragged)return;
    var gap=rows.length>1?Math.max(0,rows[1].top-rows[0].top-rows[0].height):0;
    var d={list:list,handle:handle,pointerId:e.pointerId,rows:rows,order:rows.slice(),dragged:dragged,listTop:listTop,gap:gap,contentBottom:rows[rows.length-1].top+rows[rows.length-1].height,
      pointerY:e.clientY,offset:e.clientY-row.getBoundingClientRect().top,moved:true,changed:false,phase:'drag',last:performance.now(),frame:0};
    _taskDrag=d;
    list.classList.add('is-sorting');row.classList.add('is-dragged');
    document.body.classList.add('task-dragging');handle.setAttribute('aria-pressed','true');
    handle.setPointerCapture(e.pointerId);
    document.addEventListener('pointermove',taskPointerMove,{passive:false});
    document.addEventListener('pointerup',taskPointerUp);
    document.addEventListener('pointercancel',taskPointerCancel);
    document.addEventListener('keydown',taskDragEscape);
    d.frame=requestAnimationFrame(taskDragFrame);
  });
  list.addEventListener('keydown',function(e){
    var handle=e.target.closest('.drag-handle');
    if(!handle||!['ArrowUp','ArrowDown'].includes(e.key)||_taskDrag)return;
    e.preventDefault();
    var rows=Array.from(list.querySelectorAll(':scope > .task[data-task-id]'));
    var current=handle.closest('.task[data-task-id]');var index=rows.indexOf(current);
    var target=index+(e.key==='ArrowUp'?-1:1);
    if(target<0||target>=rows.length)return;
    var moved=rows.splice(index,1)[0];rows.splice(target,0,moved);
    var id=current.dataset.taskId;
    commitTaskOrder(rows.map(function(el){return el.dataset.taskId;}));renderAll();
    var replacement=Array.from(document.querySelectorAll('#taskList > .task[data-task-id]')).find(function(el){return el.dataset.taskId===id;});
    if(replacement)replacement.querySelector('.drag-handle').focus();
    toast(e.key==='ArrowUp'?'任务已上移':'任务已下移');
  });
}
function taskPointerMove(e){
  var d=_taskDrag;if(!d||d.phase!=='drag'||e.pointerId!==d.pointerId)return;
  e.preventDefault();
  if(e.clientY!==d.pointerY){d.pointerY=e.clientY;d.moved=true;}
}
function taskPointerCancel(e){if(_taskDrag&&e.pointerId===_taskDrag.pointerId)taskDragCleanup(_taskDrag);}
function taskPointerUp(e){
  var d=_taskDrag;if(!d||e.pointerId!==d.pointerId)return;
  d.phase='settle';d.settleAt=performance.now();d.list.classList.add('is-settling');
  document.removeEventListener('pointermove',taskPointerMove);
  document.removeEventListener('pointerup',taskPointerUp);
  document.removeEventListener('pointercancel',taskPointerCancel);
  try{d.handle.releasePointerCapture(d.pointerId);}catch(err){}
  if(reducedMotion())finishTaskDrop(d);
}
function taskDragTargets(d){
  var y=d.rows[0].top;
  d.order.forEach(function(r){r.target=y-r.top;y+=r.height+d.gap;});
}
function finishTaskDrop(d){
  var ids=d.order.map(function(r){return r.id;}), changed=d.changed;
  taskDragCleanup(d);
  if(changed){commitTaskOrder(ids);renderAll();toast('任务顺序已保存');}
}
function taskDragFrame(time){
  var d=_taskDrag;if(!d)return;
  if(!d.list.isConnected){cancelTaskDrag();return;}
  var dt=Math.min((time-d.last)/1000,.032)||.016;d.last=time;
  // 手指静止时不推进弹簧，也不自动滚动；松手后再收敛到最终位置。
  var advance=d.phase==='settle'||d.moved;
  if(advance&&d.phase==='drag'){
    var viewport=window.innerHeight,edge=76;
    var step=d.pointerY<edge?-Math.min(18,(edge-d.pointerY)/4):(d.pointerY>viewport-edge?Math.min(18,(d.pointerY-viewport+edge)/4):0);
    if(step)window.scrollBy(0,step);
    var y=d.pointerY+window.scrollY-d.offset-d.listTop;
    y=Math.max(d.rows[0].top-18,Math.min(d.contentBottom-d.dragged.height+18,y));
    var center=y+d.dragged.height/2,index=0,nearest=Infinity;
    d.rows.forEach(function(r,i){var dist=Math.abs(center-(r.top+r.height/2));if(dist<nearest){nearest=dist;index=i;}});
    var current=d.order.indexOf(d.dragged);
    if(index!==current){d.order.splice(current,1);d.order.splice(index,0,d.dragged);}
    d.changed=d.order.some(function(r,i){return r!==d.rows[i];});
    taskDragTargets(d);
    d.dragged.x=y-d.dragged.top;
    d.dragged.el.style.transform='translate3d(0,'+d.dragged.x+'px,0) scale(1.025)';
    d.moved=false;
  }
  var maxError=0;
  if(advance){
    d.rows.forEach(function(r){
      if(d.phase==='drag'&&r===d.dragged)return;
      if(reducedMotion()){r.x=r.target;r.v=0;}
      else{r.v+=(460*(r.target-r.x)-34*r.v)*dt;r.x+=r.v*dt;}
      maxError=Math.max(maxError,Math.abs(r.target-r.x),Math.abs(r.v)/10);
      r.el.style.transform='translate3d(0,'+r.x+'px,0)'+(r===d.dragged?' scale(1.015)':'');
    });
    if(d.phase==='settle'&&(maxError<.2||time-d.settleAt>800)){finishTaskDrop(d);return;}
  }
  d.frame=requestAnimationFrame(taskDragFrame);
}
window.addEventListener('hashchange',cancelTaskDrag);
window.addEventListener('blur',function(){if(_taskDrag&&_taskDrag.phase==='drag')taskDragCleanup(_taskDrag);});

/* 蝶卡：展开时所有卡片均可访问；叠起时只保留最上方卡片交互。 */
function toggleProjectDeck(){_deckExpanded=!_deckExpanded;layoutProjectDeck(true);}
function layoutProjectDeck(animate){
  var deck=document.getElementById('projectDeck');if(!deck)return;
  var cards=Array.from(deck.querySelectorAll(':scope > .deck-card'));
  var toggle=document.getElementById('deckToggle');
  if(toggle){toggle.textContent=_deckExpanded?'叠回卡片':'展开卡片';toggle.setAttribute('aria-expanded',String(_deckExpanded));toggle.setAttribute('aria-controls','projectDeck');toggle.disabled=cards.length<2;}
  deck.classList.add('project-deck');deck.classList.toggle('is-expanded',_deckExpanded);
  var width=deck.clientWidth;if(!width)return;
  var columns=_deckExpanded?(width>=820?3:(width>=540?2:1)):1;
  var gap=18,cardWidth=_deckExpanded?(width-gap*(columns-1))/columns:Math.min(390,width-(_deckExpanded?0:20));
  cards.forEach(function(card){card.style.width=Math.max(1,cardWidth)+'px';});
  var rowTop=8,rowHeights=[],targets=[];
  cards.forEach(function(card,i){
    var col=i%columns,row=Math.floor(i/columns);
    rowHeights[row]=Math.max(rowHeights[row]||0,card.offsetHeight+(_deckExpanded?col*10:0));
  });
  cards.forEach(function(card,i){
    var col=i%columns,row=Math.floor(i/columns),y=8;
    for(var n=0;n<row;n++)y+=rowHeights[n]+gap;
    var rank=Math.min(i,5);
    var x=_deckExpanded?col*(cardWidth+gap):(width-cardWidth)/2+(rank%2===0?1:-1)*Math.min(rank*2,10);
    y=_deckExpanded?y+col*10:8+rank*11;
    var rotation=_deckExpanded?(col%2===0?-.5:.5):(i===0?0:(rank%2===0?1:-1)*Math.min(rank*1.1,5));
    var id=card.dataset.projectId||String(i),old=_deckStates.get(id);
    var initial=old&&old.el===card?old:{el:card,x:x,y:y,r:rotation,vx:0,vy:0,vr:0};
    initial.tx=x;initial.ty=y;initial.tr=rotation;initial.el=card;
    if(!animate||reducedMotion()){initial.x=x;initial.y=y;initial.r=rotation;initial.vx=0;initial.vy=0;initial.vr=0;}
    _deckStates.set(id,initial);targets.push(initial);
    card.style.zIndex=String(_deckExpanded?cards.length-i:cards.length-i+1);
    card.classList.toggle('deck-under',!_deckExpanded&&i>0);
    card.inert=!_deckExpanded&&i>0;
    card.setAttribute('aria-hidden',String(!_deckExpanded&&i>0));
    card.style.visibility=(!_deckExpanded&&i>5)?'hidden':'visible';
    card.style.transform='translate3d('+initial.x+'px,'+initial.y+'px,0) rotate('+initial.r+'deg)';
  });
  var height=_deckExpanded?rowHeights.reduce(function(a,h){return a+h+gap;},8):Math.max.apply(null,cards.map(function(c){return c.offsetHeight;}).concat([0]))+Math.min(cards.length-1,5)*11+22;
  deck.style.height=Math.max(0,height)+'px';
  cancelAnimationFrame(_deckFrame);
  if(animate&&!reducedMotion()){
    var last=performance.now(),started=last;
    var tick=function(time){
      if(!deck.isConnected)return;
      var dt=Math.min((time-last)/1000,.032)||.016;last=time;var error=0;
      targets.forEach(function(s){
        ['x','y','r'].forEach(function(k){var v='v'+k;s[v]+=(240*(s['t'+k]-s[k])-25*s[v])*dt;s[k]+=s[v]*dt;error=Math.max(error,Math.abs(s['t'+k]-s[k]));});
        s.el.style.transform='translate3d('+s.x+'px,'+s.y+'px,0) rotate('+s.r+'deg)';
      });
      if(error>.08&&time-started<1000)_deckFrame=requestAnimationFrame(tick);
      else targets.forEach(function(s){s.x=s.tx;s.y=s.ty;s.r=s.tr;s.el.style.transform='translate3d('+s.x+'px,'+s.y+'px,0) rotate('+s.r+'deg)';});
    };_deckFrame=requestAnimationFrame(tick);
  }
  if(!deck.dataset.deckBound){
    deck.dataset.deckBound='1';
    deck.addEventListener('click',function(e){
      if(e.target.closest('button,a,input,select,textarea,label'))return;
      if(cards.length>1)toggleProjectDeck();
    });
    if(_deckObserver)_deckObserver.disconnect();
    if(window.ResizeObserver){
      var previousWidth=width;
      _deckObserver=new ResizeObserver(function(entries){var nextWidth=entries[0].contentRect.width;if(Math.abs(nextWidth-previousWidth)>1){previousWidth=nextWidth;layoutProjectDeck(false);}});
      _deckObserver.observe(deck);
    }
  }
}
