<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>业务工作台</title>
<meta name="application-version" content="2026.11.06.9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232456E6'/%3E%3Cpath d='M7 12.5l3.2 3.2L17 9' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F3F4F7; --card:#FFFFFF; --ink:#171A21; --ink2:#5B6270; --ink3:#9AA1AD;
  --line:#E6E8EE; --brand:#2456E6; --brand-d:#1B44C0; --brand-soft:#EAF0FF;
  --red:#D94848; --red-soft:#FDECEC; --amber:#D98A14; --amber-soft:#FBF1DE;
  --green:#2E9E6B; --green-soft:#E6F4EC;
  --r:14px; --r2:10px;
  --shadow:0 1px 2px rgba(20,24,40,.05),0 4px 16px rgba(20,24,40,.05);
  --pa:.85; --blur:blur(12px);
}
html.tl-light{--ink:#fff;--ink2:rgba(255,255,255,.88);--ink3:rgba(255,255,255,.62);--line:rgba(255,255,255,.3)}
html.tl-light body{text-shadow:0 1px 3px rgba(0,0,0,.45)}
:root{--panel:rgba(255,255,255,var(--pa));--panel-in:rgba(255,255,255,calc(var(--pa)*.55))}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.55;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
a{color:var(--brand);text-decoration:none}
svg{display:block}

/* ---------- 布局 ---------- */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:216px;background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-right:1px solid var(--line);padding:20px 12px;display:none;flex-direction:column;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 10px 18px}
.logo .mark{width:30px;height:30px;border-radius:8px;background:var(--brand);display:flex;align-items:center;justify-content:center;flex:none}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;color:var(--ink2);font-size:14.5px;width:100%;text-align:left;margin-bottom:2px}
.nav-item svg{width:19px;height:19px;flex:none}
.nav-item:hover{background:var(--bg)}
.nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.main{min-height:100vh;min-height:100dvh;padding-bottom:84px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar .date{font-size:13px;color:var(--ink3);margin-bottom:2px}
.topbar h1{font-size:22px;font-weight:700;letter-spacing:.5px}

/* ---------- 底部 tabbar（手机） ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-top:1px solid var(--line);display:flex;overflow-x:auto;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.tabbar::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;color:var(--ink3);font-size:11px}
.tab svg{width:21px;height:21px}
.tab.active{color:var(--brand)}

@media(min-width:900px){
  .sidebar{display:flex}
  .main{margin-left:216px;padding-bottom:40px}
  .tabbar{display:none}
  .wrap{padding:26px 28px 60px}
}

/* ---------- 通用组件 ---------- */
.card{background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card+.card{margin-top:14px}
.grid>.card+.card{margin-top:0}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.card-h h3{font-size:15.5px;font-weight:700}
.muted{color:var(--ink3);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--panel-in);color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.ghost{border-color:transparent;color:var(--brand);background:var(--brand-soft)}
.btn.danger{color:var(--red);background:var(--red-soft)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--panel-in);color:var(--ink2);white-space:nowrap}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.grid{display:grid;gap:14px}
@media(min-width:720px){.cols-2{grid-template-columns:1fr 1fr}.cols-4{grid-template-columns:repeat(4,1fr)}.cols-3{grid-template-columns:repeat(3,1fr)}}

/* 统计条 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px}
.stat .n{font-size:24px;font-weight:700;line-height:1.1}
.stat .l{font-size:12px;color:var(--ink2);margin-top:3px}
.stat.red .n{color:var(--red)} .stat.amber .n{color:var(--amber)} .stat.green .n{color:var(--green)}
@media(max-width:520px){.stat .n{font-size:20px}}

/* 最重要 3 件事 */
.focus-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line)}
.focus-item:last-child{border-bottom:none}
.focus-no{width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.focus-item.f1 .focus-no{background:var(--red)}
.focus-item.f2 .focus-no{background:var(--amber)}

/* 任务行 */
.task{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink3);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.check.done{background:var(--green);border-color:var(--green)}
.check svg{width:13px;height:13px;opacity:0}
.check.done svg{opacity:1}
.task-body{flex:1;min-width:0}
.task-title{font-size:14.5px;word-break:break-word}
.task.done .task-title{color:var(--ink3);text-decoration:line-through}
.task-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.task-ops{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.iconbtn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.iconbtn:hover{background:var(--bg);color:var(--brand)}
.iconbtn svg{width:16px;height:16px}
.empty{padding:22px 8px;text-align:center;color:var(--ink3);font-size:13.5px}

/* 项目卡 */
.proj{display:flex;flex-direction:column;gap:10px}
.proj-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.proj-name{font-weight:700;font-size:15px;word-break:break-word}
.bar{height:7px;border-radius:99px;background:var(--panel-in);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.bar.red i{background:var(--red)} .bar.amber i{background:var(--amber)} .bar.green i{background:var(--green)}
.proj-meta{display:flex;flex-wrap:wrap;gap:6px}
.proj-next{font-size:13px;color:var(--ink2);background:var(--panel-in);padding:7px 10px;border-radius:8px}

/* 风险 */
.risk{display:flex;gap:12px;padding:12px;border-radius:var(--r2);border:1px solid var(--line);margin-bottom:10px;align-items:flex-start}
.risk:last-child{margin-bottom:0}
.risk .dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}
.risk.sev-red .dot{background:var(--red)} .risk.sev-amber .dot{background:var(--amber)} .risk.sev-green .dot{background:var(--green)}
.risk.sev-red{border-color:#F3C2C2;background:#FFF8F8}
.risk.sev-amber{border-color:#EFD9AE;background:#FFFCF4}
.risk .cnt{font-weight:700;font-size:18px}

/* 复盘环 */
.ring-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring{width:130px;height:130px;flex:none}
.ring .pct{font-size:24px;font-weight:700}

/* 表单 */
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-in);outline:none;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);background:rgba(255,255,255,.9)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(15,18,30,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.mask.open{display:flex}
.modal{background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
@media(min-width:600px){.mask{align-items:center}.modal{border-radius:18px}}
.modal h3{font-size:17px;margin-bottom:14px}
.modal-ops{display:flex;gap:10px;margin-top:6px}
.modal-ops .btn{flex:1}
.copybox{background:var(--bg);border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;max-height:300px;overflow-y:auto;line-height:1.7}

/* 邮件 */
.mail{padding:11px 0;border-bottom:1px solid var(--line)}
.mail:last-child{border-bottom:none}
.mail .from{font-size:13px;color:var(--ink2)}
.mail .subj{font-weight:600;font-size:14.5px}
.banner{border-radius:var(--r2);padding:11px 13px;font-size:13px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.banner.info{background:var(--brand-soft);color:var(--brand-d)}
.banner.warn{background:var(--amber-soft);color:var(--amber)}
.banner.ok{background:var(--green-soft);color:var(--green)}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#171A21;color:#fff;padding:10px 18px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:99;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 密码锁 */
.lock-mask{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.lock-mask.open{display:flex}
.lock-card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:32px 26px;width:100%;max-width:340px;text-align:center}
.lock-logo{width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 auto 12px}
.lock-card h2{font-size:18px;margin-bottom:4px}
.lock-sub{color:var(--ink3);font-size:13px;margin-bottom:18px}
.lock-card input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);text-align:center;font-size:18px;letter-spacing:4px;outline:none;margin-bottom:10px}
.lock-card input:focus{border-color:var(--brand);background:#fff}
.lock-card .btn{width:100%}
.lock-err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.view{display:none}.view.active{display:block}
.tip{font-size:12.5px;color:var(--ink3);margin-top:6px}
/* 自定义壁纸 */
#bgLayer{position:fixed;inset:0;z-index:-2;background:var(--bg);background-size:cover;background-position:center;background-repeat:no-repeat}
#bgShade{position:fixed;inset:0;z-index:-1;background:rgba(0,0,0,.2);pointer-events:none}
.wp-presets{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0 6px}
.wp-preset{height:44px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.wp-preset.on{border-color:var(--brand)}
.wp-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.wp-row label{flex:0 0 74px;font-size:13px;color:var(--ink2)}
.wp-row input[type=range]{flex:1;accent-color:var(--brand);height:24px}
.wp-row .wv{flex:0 0 40px;font-size:12.5px;color:var(--ink3);text-align:right}
.wp-preview{width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin-bottom:10px;max-height:240px;object-fit:contain;background:#0d1117}
input[type=file]{display:none}
.wp-ops{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.wp-ops .btn{min-height:44px}
/* ================= 本次更新：玻璃、配色与批量选择 ================= */
:root{--surface-rgb:255,255,255;--panel:rgba(var(--surface-rgb),var(--pa));--panel-in:rgba(var(--surface-rgb),calc(var(--pa)*.55));--glass:rgba(255,255,255,.28);--glass-edge:rgba(255,255,255,.48)}
body{background:transparent}
.view:not(#view-projects) .card:not(.item-colored),.view:not(#view-projects) .stat,
.view:not(#view-projects) .banner,#view-risks .risk{
  background:var(--glass);border-color:var(--glass-edge);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 30px rgba(25,35,60,.08)
}
.view:not(#view-projects) .banner{color:var(--ink)}
.item-colored{background:var(--item-bg)!important;color:var(--item-ink)!important;text-shadow:none;--ink:var(--item-ink);--ink2:var(--item-ink);--ink3:var(--item-ink);--line:color-mix(in srgb,var(--item-ink) 25%,transparent);--panel-in:transparent}
.item-colored .muted,.item-colored .tip,.item-colored .proj-next,.item-colored .task-title,.item-colored .iconbtn,.item-colored .switch,.item-colored .field label{color:var(--item-ink)}
.item-colored .chip,.item-colored .btn{color:var(--item-ink);background:var(--panel-in);border-color:var(--line)}
.item-colored .chip,.item-colored .proj-next{box-shadow:inset 0 0 0 1px var(--line)}
.item-colored .bar{background:var(--line)}
.item-colored .iconbtn:hover{background:var(--panel-in);color:var(--item-ink)}
.item-colored .field input,.item-colored .field textarea,.item-colored .field select{background:var(--item-bg);color:var(--item-ink);border-color:var(--line);color-scheme:var(--item-scheme)}
.item-colored .field input:focus,.item-colored .field textarea:focus,.item-colored .field select:focus{outline:2px solid var(--item-ink);outline-offset:1px;background:var(--item-bg)}
.item-colored input::placeholder,.item-colored textarea::placeholder{color:var(--item-ink);opacity:.72}
.item-colored input[type=checkbox]{accent-color:var(--item-ink)}
.item-colored .check{border-color:var(--item-ink)}
.item-colored .check.done{background:var(--item-ink);border-color:var(--item-ink)}
.item-colored .check.done path{stroke:var(--item-bg)}
.task.item-colored{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.task.item-colored:last-child{border-bottom:1px solid var(--line)}
.task.item-colored.done .task-title{color:var(--item-ink)}
.task.item-colored.done{--item-bg:#D8DBE2!important;--item-ink:#353B45!important;--item-scheme:light!important}
.task-selection{appearance:none;-webkit-appearance:none;display:grid;place-items:center;width:20px;height:20px;border:1.5px solid var(--item-ink);border-radius:5px;flex:none;margin:2px 0 0;cursor:pointer;background:transparent}
.task-selection:checked{background:var(--item-ink)}
.task-selection:checked:after{content:'✓';color:var(--item-bg);font-size:14px;font-weight:800;line-height:1}
.task-selection:focus-visible{outline:2px solid var(--item-ink);outline-offset:3px}
.task-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-left:auto}
.task-batch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.task-batch [hidden]{display:none}
.selection-status{font-size:12px;color:var(--ink2)}
.color-fields{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0 14px}
.color-label{display:inline-flex;align-items:center;gap:8px;font-size:13px}
input[type=color]{width:46px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer}
.color-code{font-variant-numeric:tabular-nums;font-size:12px}
.wp-preset{display:block;width:100%;padding:0}
.wp-row select{max-width:180px;padding:5px;border:1px solid var(--line);border-radius:7px;background:var(--panel-in)}
.project-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.project-toolbar>.muted{flex:1;min-width:150px}
.top-actions{display:flex;align-items:center;gap:9px}
.top-actions [hidden]{display:none}
.btn.icon-only{width:40px;height:40px;padding:0;position:relative;flex:none}
#newTaskButton{font-size:26px;font-weight:400;line-height:1}
.recycle-count{position:absolute;right:-5px;top:-5px;min-width:18px;height:18px;padding:0 4px;display:grid;place-items:center;border-radius:99px;background:var(--brand);color:white;font-size:10px;border:1px solid var(--glass-edge)}
#recycleButton.active{color:var(--brand);background:var(--brand-soft)}
.deck-toggle-icon{display:block}
@media(max-width:520px){.task.item-colored{gap:7px;padding:10px 8px}.task-ops{flex-direction:column}.task-tools{gap:6px}.card-h{flex-wrap:wrap}.color-code{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important}.check{transition:none}}

/* 任务手势：单指滚动与长按排序统一裁决，浏览器保留双指缩放。 */
.sortable-list{position:relative;isolation:isolate;overflow:visible;}
.sortable-list>.task{position:relative;will-change:transform;touch-action:pinch-zoom;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.sortable-list>.task:focus-visible{outline:2px solid currentColor;outline-offset:2px;}
.task-dragging,.task-dragging *{user-select:none!important;cursor:grabbing!important;}
.sortable-list.is-sorting>.task{transition:none!important;}
.sortable-list.is-sorting>.task.is-dragged{z-index:8;box-shadow:0 14px 32px rgba(20,24,40,.25);outline:2px solid currentColor;outline-offset:1px;}
.sortable-list.is-settling{pointer-events:auto;}
.project-deck{position:relative;isolation:isolate;margin:0 -2px;padding:0 2px;transition:height .65s cubic-bezier(.2,.8,.2,1);}
.project-deck>.deck-card{position:absolute;left:0;top:0;margin:0!important;transform-origin:50% 28%;will-change:transform;box-shadow:0 10px 25px rgba(20,24,40,.12);}
.project-deck>.deck-card.deck-under{pointer-events:none;}
.project-deck:not(.is-expanded)>.deck-card:first-child{cursor:pointer;}
.project-deck>.deck-card .proj-name{overflow-wrap:anywhere;}
.deck-controls{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
.deck-hint{font-size:12.5px;color:var(--ink2);margin-bottom:10px;}
@media(max-width:520px){
 .sortable-list>.task{gap:7px;}
 .project-deck>.deck-card{padding:14px;}
}
@media(prefers-reduced-motion:reduce){
 .project-deck{transition:none;}
 .sortable-list>.task{animation:none!important;}
}

/* ================= 三态筛选与状态菜单，沿用玻璃面板与项目配色 ================= */
.title-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:100%}
.title-row [hidden],#taskDateControls[hidden],#clearTaskDate[hidden]{display:none!important}
#taskInboxHeading{font-size:22px;font-weight:700;letter-spacing:.5px;line-height:1.55;padding:1px 2px;border-bottom:2px solid transparent;text-align:left;white-space:nowrap}
#taskInboxHeading.active{color:var(--brand);border-bottom-color:var(--brand)}
#taskInboxHeading:focus-visible{outline:2px solid var(--brand);outline-offset:4px;border-radius:4px}
#taskStatusTabs{display:flex;align-items:center;gap:7px;flex-wrap:wrap}

.task-workflow-tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

@media(max-width:520px){
 .title-row{gap:8px;align-items:center}

/* ================= 双日期筛选：保留玻璃外观，窄屏自动换行 ================= */

#taskDateControls .task-period-clear{flex:0 0 24px;display:grid;place-items:center;width:24px;min-width:24px;height:28px;padding:0;border:0;border-radius:7px;color:var(--ink2);font-size:18px;background:none}

/* ================= 标准工时与复测：同款玻璃面板，宽表格仅在容器内滚动 ================= */
#view-worktime,#view-worktime-retest{min-width:0}

.worktime-retest-link{margin-left:auto}
.worktime-products{align-items:start}
.worktime-product{min-width:0}
.worktime-product-heading{min-width:0}
.worktime-product-heading h2{font-size:17px;font-weight:650;line-height:1.45;overflow-wrap:anywhere;margin-top:3px}
.worktime-pn{font-size:12px;color:var(--ink2);font-weight:650;letter-spacing:.4px;overflow-wrap:anywhere}
.worktime-product-actions{display:flex;align-items:center;gap:7px;flex:none}
.worktime-facts{display:grid;grid-template-columns:1fr 1fr;gap:11px 15px;margin:17px 0}
.worktime-facts>div{min-width:0}

.worktime-facts dd{font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.worktime-metrics{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--glass-edge);border-radius:11px;overflow:hidden;background:var(--panel-in)}

.worktime-metric+.worktime-metric{border-left:1px solid var(--glass-edge)}
.worktime-metric>span{display:block;font-size:11px;color:var(--ink2)}
.worktime-metric strong{display:block;font-size:22px;line-height:1.3;margin-top:5px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.worktime-metric small{font-size:11px;font-weight:500;margin-left:5px;color:var(--ink2)}
.worktime-product-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:15px;flex-wrap:wrap}
.worktime-product-footer .muted{font-size:11.5px}
.modal:has(>.worktime-editor){width:calc(100% - 32px);max-width:1180px;max-height:90vh;max-height:90dvh;padding:22px;overscroll-behavior:contain}
.worktime-editor{min-width:0}

.worktime-editor-heading>.iconbtn{flex:none;font-size:25px;line-height:1}
.worktime-editor .field{min-width:0}
.worktime-editor .field label{font-size:12.5px}
.worktime-fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 13px}
.worktime-required{color:var(--red);margin-left:4px}
.worktime-auto{display:inline-block;font-size:10px;font-weight:500;color:var(--ink3);margin-left:5px;white-space:nowrap}
.worktime-editor input[readonly]{background:var(--panel-in);color:var(--ink2);font-variant-numeric:tabular-nums}
.worktime-editor-totals{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding-top:3px}
.worktime-editor-totals input{font-size:20px;font-weight:650}
.worktime-process-fieldset{border:1px solid var(--glass-edge);border-radius:12px;padding:12px;min-width:0;margin-top:7px;background:var(--glass)}
.worktime-process-fieldset legend{padding:0 5px;font-size:14px;font-weight:700}
.worktime-process-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.worktime-process-toolbar .muted{font-size:12px}
.worktime-process-fieldset:disabled{opacity:.65}
.worktime-process-fieldset:disabled button{cursor:not-allowed}
.worktime-table-scroll{width:100%;max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;border:1px solid var(--glass-edge);border-radius:9px;scrollbar-width:thin}
.worktime-table-scroll:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.worktime-process-table{border-collapse:separate;border-spacing:0;width:100%;min-width:1530px;font-size:12px;text-align:left}
.worktime-process-table th{font-size:11.5px;color:var(--ink2);font-weight:650;padding:10px 8px;border-bottom:1px solid var(--glass-edge);white-space:nowrap;background:var(--panel-in);vertical-align:top}
.worktime-process-table th small{display:block;font-size:10px;color:var(--ink3);font-weight:500}
.worktime-process-table th .worktime-auto{display:block;margin-left:0}
.worktime-process-table td{padding:8px 5px;min-width:104px;border-bottom:1px solid var(--glass-edge);vertical-align:middle}
.worktime-process-table td:first-child{min-width:66px;width:66px}
.worktime-process-table td:last-child{min-width:50px;width:50px}
.worktime-process-table td:nth-child(2),.worktime-process-table td:nth-child(3),.worktime-process-table td:nth-child(4),.worktime-process-table td:nth-child(7){min-width:150px}
.worktime-process-table td:nth-child(2){min-width:66px;width:66px}
.worktime-process-table td:nth-child(3),.worktime-process-table td:nth-child(4),.worktime-process-table td:nth-child(5),.worktime-process-table td:nth-child(8){min-width:150px}
.worktime-process-table tr:last-child td{border-bottom:0}
.worktime-process-table input{display:block;width:100%;min-width:0;padding:8px 7px;border:1px solid var(--line);border-radius:7px;outline:none;background:var(--panel-in);font-size:13px;color:var(--ink)}
.worktime-process-table input:focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.worktime-process-table input[type=number]{font-variant-numeric:tabular-nums}
.worktime-process-table .worktime-calculated{background:var(--panel-in);font-variant-numeric:tabular-nums;text-align:right;padding-right:12px}
.worktime-process-table output{display:block;min-width:80px;font-size:13px;color:var(--ink2);white-space:nowrap}
.worktime-remove-process{color:var(--red)}
.worktime-process-batch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.worktime-process-batch>span{font-size:12px;margin-right:auto}
.worktime-process-batch .btn:disabled{opacity:.45;cursor:not-allowed}
.worktime-process-table .worktime-process-select-cell{position:sticky;left:0;z-index:1;min-width:44px;width:44px;text-align:center;background:#fff!important;padding:8px}
.worktime-process-table th.worktime-process-select-cell{background:#f0f3f8!important;z-index:2}
.worktime-process-table .worktime-process-select-cell input[type=checkbox]{display:inline-block;appearance:auto;min-width:18px;width:18px;height:18px;margin:0;padding:0;accent-color:var(--brand);cursor:pointer;vertical-align:middle}
.worktime-process-table .worktime-process-row-ops{min-width:86px;white-space:nowrap}
.worktime-process-row-ops>.iconbtn{display:inline-flex;vertical-align:middle}
.worktime-process-table tr.worktime-process-selected td{background:#eef3ff!important}
.worktime-process-table tr.worktime-process-selected .worktime-process-select-cell{background:#e8efff!important}
.worktime-process-empty{text-align:center;padding:16px;font-size:12px}
.worktime-editor [hidden],.worktime-process-empty[hidden]{display:none!important}
.worktime-editor-ops{position:sticky;bottom:-22px;padding:14px 0 4px;margin-top:14px;background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);z-index:2}
.worktime-form-error{margin-top:12px;padding:10px 12px;border:1px solid var(--red);border-radius:10px;color:var(--red);background:var(--red-soft);font-size:13px}
.worktime-settings-form{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:9px}
.worktime-settings-form .field{margin:0;flex:1 1 180px;max-width:230px}
.worktime-settings-form .btn{height:43px}
.worktime-review{border:1px solid var(--glass-edge);border-radius:12px;padding:14px;background:var(--panel-in)}
.worktime-review+.worktime-review{margin-top:11px}
.worktime-review-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.worktime-review h4{font-size:15px;margin-top:3px;overflow-wrap:anywhere}
.worktime-review-meta{display:flex;flex-wrap:wrap;gap:5px 13px;margin-top:11px;color:var(--ink2);font-size:11.5px}
.worktime-review-ops{display:flex;align-items:center;gap:8px;margin-top:15px;flex-wrap:wrap}
.worktime-review-ops .iconbtn{margin-left:auto}
.worktime-history-row{display:flex;align-items:center;justify-content:space-between;gap:13px;padding:12px 0;border-bottom:1px solid var(--glass-edge)}
.worktime-history-row:first-child{padding-top:0}
.worktime-history-row:last-child{padding-bottom:0;border-bottom:0}
.worktime-history-row>div{min-width:0;overflow-wrap:anywhere}
.worktime-history-row strong{font-size:13px}
.worktime-history-row .btn{flex:none}
.worktime-history-row .muted{font-size:11.5px;margin-top:3px}
.worktime-history-version{font-size:11px;color:var(--ink3);margin-left:7px}
@media(max-width:850px){.worktime-fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:599px){
 .modal:has(>.worktime-editor){width:100%;max-height:92vh;max-height:92dvh;padding:18px 13px calc(18px + env(safe-area-inset-bottom))}

 .worktime-editor .field input{padding:9px;font-size:16px}
 .worktime-editor .field label{font-size:11.5px}
 .worktime-editor-totals{gap:9px}
 .worktime-editor-totals .worktime-auto{display:block;margin-left:0;font-size:10px}

/* PN 搜索与分页让大产品库保持轻量；卡片沿用玻璃外观。 */
.worktime-search-toggle.active{color:var(--brand);background:var(--brand-soft)}

.worktime-search-input{display:flex;gap:8px;align-items:center;min-width:0}
.worktime-search-input input{width:100%;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:9px;outline:none;background:var(--panel-in)}
.worktime-search-input input:focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.worktime-search-input .btn{flex:none}
.worktime-search-summary{margin:0 0 13px;font-size:12px}
.worktime-status-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--glass-edge)}
.worktime-status-row>label{font-size:11px;color:var(--ink2);white-space:nowrap}
.worktime-card-status{max-width:100%;min-width:116px;padding:6px 10px;border:1px solid var(--glass-edge);border-radius:9px;background:var(--panel-in);color:var(--ink);font-size:13px}
.worktime-export-ops{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:13px;margin-top:13px;border-top:1px solid var(--glass-edge)}

.worktime-product .btn:disabled,.worktime-toolbar .btn:disabled,.worktime-pagination .btn:disabled{opacity:.45;cursor:not-allowed}

/* 产品编辑器始终使用实色，隔离壁纸和文字设置带来的低对比度。 */
.modal:has(>.worktime-editor){
 --ink:#171a21;--ink2:#535d6e;--ink3:#788294;--line:#dfe4ec;
 --panel:#fff;--panel-in:#f4f6fa;--glass:#f7f8fb;--glass-edge:#dfe4ec;
 background:#fff!important;color:#171a21;text-shadow:none;opacity:1;
 backdrop-filter:none;-webkit-backdrop-filter:none;
}
.worktime-editor,.worktime-editor input,.worktime-editor select,.worktime-editor textarea,.worktime-editor button{text-shadow:none}
.worktime-editor .field input,.worktime-editor .field select{background:#f4f6fa;color:#171a21;border-color:#dfe4ec}

.worktime-editor-ops{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none}
.worktime-editor .worktime-process-fieldset{background:#f7f8fb}
.worktime-editor .worktime-table-scroll{background:#fff}

@media(max-width:599px){
 .worktime-toolbar{gap:9px}
 .worktime-toolbar #worktimeProductCount{font-size:11.5px}
 .worktime-toolbar .worktime-retest-link{padding-left:9px;padding-right:9px}

/* 工时复判通知和新增导航仍随壁纸使用玻璃色。 */
.sidebar #sideNav{overflow-y:auto;min-height:0;scrollbar-width:thin}
.worktime-review-notice{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--glass);border-color:var(--glass-edge);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}

.tab .worktime-nav-count{position:absolute;top:2px;right:2px;font-size:9px;min-width:15px;padding:0 3px}

.modal:has(>.worktime-delete-confirm){max-width:480px}

.worktime-copy-product{margin-right:auto;flex:none!important;width:36px;padding:0!important;min-width:36px!important}

.worktime-pn-error[hidden]{display:none!important}
.worktime-editor #wtPN[aria-invalid="true"]{border-color:#c53636}

</style>

<body>
<div id="bgLayer"></div>
<div id="bgShade"></div>

<aside class="sidebar">
  <div class="logo"><span class="mark"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>业务工作台</div>
  <nav id="sideNav"></nav>
</aside>

<div class="main">
  <div class="wrap">
    <div class="topbar">

/* ================= 任务三态、创建日筛选与可恢复回收站模型 ================= */
/* ================= 任务开始日 / 完成日的日、ISO 周、月区间模型 ================= */
function taskPeriodUtcDate(year,month,day){
  var date=new Date(0);date.setUTCHours(0,0,0,0);date.setUTCFullYear(year,month,day);return date;
}
function taskPeriodUtcDay(date){
  return String(date.getUTCFullYear()).padStart(4,'0')+'-'+String(date.getUTCMonth()+1).padStart(2,'0')+'-'+String(date.getUTCDate()).padStart(2,'0');
}
function taskPeriodWeekStart(year){
  var date=taskPeriodUtcDate(year,0,4);
  date.setUTCDate(date.getUTCDate()-(date.getUTCDay()+6)%7);return date;
}
function taskPeriodKnownMode(mode){return mode==='day'||mode==='week'||mode==='month';}
function taskPeriodRange(mode,value){
  if(!taskPeriodKnownMode(mode)||typeof value!=='string'||!value)return null;
  if(mode==='day'){
    var day=workflowCalendarDate(value);
    return day&&+day.slice(0,4)>0?{start:day,end:day}:null;
  }
  var match=(mode==='month'?/^(\d{4})-(\d{2})$/:/^(\d{4})-W(\d{2})$/).exec(value);
  if(!match)return null;
  var year=+match[1],number=+match[2],start,end;
  if(year<1)return null;
  if(mode==='month'){
    if(number<1||number>12)return null;
    start=taskPeriodUtcDate(year,number-1,1);end=taskPeriodUtcDate(year,number,0);
  }else{
    var first=taskPeriodWeekStart(year),next=taskPeriodWeekStart(year+1);
    var count=Math.round((next.getTime()-first.getTime())/604800000);
    if(number<1||number>count)return null;
    start=new Date(first.getTime()+(number-1)*604800000);
    end=new Date(start.getTime()+6*86400000);
  }
  return {start:taskPeriodUtcDay(start),end:taskPeriodUtcDay(end)};
}
function validTaskPeriod(mode,value){return taskPeriodKnownMode(mode)&&(value===''||taskPeriodRange(mode,value)!==null);}
function taskPeriodValueForDate(mode,day){
  if(!taskPeriodKnownMode(mode))return '';
  day=workflowLocalDate(day);if(!day||+day.slice(0,4)<1)return '';
  if(mode==='day')return day;
  if(mode==='month')return day.slice(0,7);
  var parts=day.split('-').map(Number),date=taskPeriodUtcDate(parts[0],parts[1]-1,parts[2]);
  var monday=new Date(date.getTime()-((date.getUTCDay()+6)%7)*86400000);
  var thursday=new Date(monday.getTime()+3*86400000),year=thursday.getUTCFullYear();
  var week=Math.round((monday.getTime()-taskPeriodWeekStart(year).getTime())/604800000)+1;
  return String(year).padStart(4,'0')+'-W'+String(week).padStart(2,'0');
}
function taskStartDate(task){return task&&typeof task==='object'?workflowLocalDate(task.startDate):'';}
function taskCompletionDate(task){return task&&typeof task==='object'&&taskStatus(task)==='completed'?workflowLocalDate(task.doneAt):'';}
function taskPeriodIncludesDay(range,day){
  if(!range||!day)return false;
  // UTC 日历数值比较可正确覆盖跨年周，也避免本机夏令时影响日长。
  function stamp(value){var parts=value.split('-').map(Number);return taskPeriodUtcDate(parts[0],parts[1]-1,parts[2]).getTime();}
  var value=stamp(day);return value>=stamp(range.start)&&value<=stamp(range.end);
}
function getTaskPeriodFilteredList(status,startFilter,completionFilter){
  status=status==='in_progress'||status==='blocked'||status==='completed'?status:'all';
  var useStart=!!(startFilter&&startFilter.value!=null&&startFilter.value!==''),useCompletion=!!(completionFilter&&completionFilter.value!=null&&completionFilter.value!=='');
  var startRange=useStart?taskPeriodRange(startFilter.mode,startFilter.value):null,completionRange=useCompletion?taskPeriodRange(completionFilter.mode,completionFilter.value):null;
  if(useStart&&!startRange||useCompletion&&!completionRange)return [];
  return orderedWorkflowTasks().filter(function(task){
    return !task.deleted&&!task.systemDemo&&(status==='all'||taskStatus(task)===status)&&
      (!useStart||taskPeriodIncludesDay(startRange,taskStartDate(task)))&&
      (!useCompletion||taskPeriodIncludesDay(completionRange,taskCompletionDate(task)));
  });
}

function taskStatus(task){
  if(!task||typeof task!=='object')return 'in_progress';
  var status=task.status,valid=status==='in_progress'||status==='blocked'||status==='completed';
  // 兼容仍缓存旧页面的设备：旧版只会更新 done，不认识 status。
  if(task.done===true)return 'completed';
  if(task.done===false&&status==='completed')return 'in_progress';
  if(valid)return status;
  return task.blocked===true?'blocked':'in_progress';
}
function workflowCalendarDate(value){
  if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return '';
  var parts=value.split('-').map(Number),date=new Date(0);
  date.setFullYear(parts[0],parts[1]-1,parts[2]);date.setHours(0,0,0,0);
  return date.getFullYear()===parts[0]&&date.getMonth()===parts[1]-1&&date.getDate()===parts[2]?value:'';
}
function workflowLocalDate(value){
  var day=workflowCalendarDate(value);if(day)return day;
  if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}T/.test(value))return '';
  var date=new Date(value);if(!Number.isFinite(date.getTime()))return '';
  return String(date.getFullYear()).padStart(4,'0')+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
}
function taskCreatedDate(task){return task&&typeof task==='object'?workflowLocalDate(task.createdAt):'';}
function normalizeTaskRecord(task){
  if(!task||typeof task!=='object')return task;
  var status=taskStatus(task);
  task.status=status;task.done=status==='completed';task.blocked=status==='blocked';
  // 不把开始日或截止日当作创建日，也不为未知的完成日期编造时间。
  task.doneAt=task.done?(workflowLocalDate(task.doneAt)||null):null;
  return task;
}

    tasks.forEach(function(task){

    });
    (Array.isArray(data.projects)?data.projects:[]).forEach(function(project){
      if(project&&project.deleted&&projectSignatures.some(function(pair){return project.name===pair[0]&&project.nextStep===pair[1];}))project.systemDemo=true;
    });
    (Array.isArray(data.mails)?data.mails:[]).forEach(function(mail){
      if(mail&&mail.deleted&&mailSignatures.some(function(row){return mail.from===row[0]&&mail.subj===row[1]&&mail.snippet===row[2];}))mail.systemDemo=true;

  }

  data.taskWorkflowVersion=1;

function orderedWorkflowTasks(){
  var list=typeof state==='object'&&state&&Array.isArray(state.tasks)?state.tasks:[];
  var ordered=typeof sortTasks==='function'?sortTasks(list):list.slice();
  var byId=new Map(),seen=new Set(),result=[];
  ordered.forEach(function(task){if(task&&typeof task.id==='string'&&!byId.has(task.id))byId.set(task.id,task);});
  var order=typeof state==='object'&&state&&Array.isArray(state.taskOrder)?state.taskOrder:[];
  order.forEach(function(id){if(byId.has(id)&&!seen.has(id)){seen.add(id);result.push(byId.get(id));}});
  ordered.forEach(function(task){if(task&&byId.has(task.id)&&!seen.has(task.id)){seen.add(task.id);result.push(task);}});
  return result;
}
function getFilteredTaskList(status){return getTaskPeriodFilteredList(status,taskStartFilter,taskCompletionFilter);}

function mergeVisibleTaskOrder(ids){
  var tasks=orderedWorkflowTasks(),known=new Map(),requested=[],selected=new Set();
  tasks.forEach(function(task){known.set(task.id,task);});
  (Array.isArray(ids)?ids:[]).forEach(function(id){
    var task=known.get(id);
    if(task&&!task.deleted&&!task.systemDemo&&!selected.has(id)){selected.add(id);requested.push(id);}
  });
  var position=0;
  // 只交换可见项曾占据的槽位，日期或状态筛选隐藏的任务及回收站项保持原顺序。
  return tasks.map(function(task){return selected.has(task.id)?requested[position++]:task.id;});

/* ================= 标准工时计算与周期复测（无页面依赖） ================= */
/* ================= PN 唯一性：保留原值，仅使用规范键比较 ================= */
function worktimePnKey(value){
  if(typeof value!=='string')return '';
  // 兼容全角字母、数字及空格；保留前导零、内部空格和标点的含义。
  return value.normalize('NFKC').trim().toUpperCase();
}
function findDuplicateWorktimePn(data,pn,excludeId){
  var key=worktimePnKey(pn);if(!key)return null;
  var products=data&&Array.isArray(data.worktimeProducts)?data.worktimeProducts:[];
  return products.find(function(product){
    if(!product||typeof product!=='object'||product.deleted)return false;
    if(excludeId!=null&&excludeId!==''&&product.id===excludeId)return false;
    return worktimePnKey(product.pn)===key;
  })||null;
}
function validateWorktimePnUnique(product,data){
  // 必填检查由产品表单校验负责；这里只报告 PN 冲突。
  if(!product||typeof product!=='object')return '';
  return findDuplicateWorktimePn(data,product.pn,product.id)?'PN号已存在，请使用其他PN号':'';
}
function worktimeDuplicatePnGroups(data){
  var groups=new Map();
  (data&&Array.isArray(data.worktimeProducts)?data.worktimeProducts:[]).forEach(function(product){
    if(!product||typeof product!=='object'||product.deleted)return;
    var key=worktimePnKey(product.pn);if(!key)return;
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(product);
  });
  var duplicates=[];
  groups.forEach(function(products,key){if(products.length>1)duplicates.push({key:key,products:products});});
  return duplicates;
}

var WORKTIME_PRODUCT_LIMIT=9999;
function worktimeActiveProductCount(data){
  return (data&&Array.isArray(data.worktimeProducts)?data.worktimeProducts:[]).reduce(function(count,product){return count+(product&&!product.deleted?1:0);},0);
}
function worktimeCanCreateProduct(data){return worktimeActiveProductCount(data)<WORKTIME_PRODUCT_LIMIT;}
function worktimeProductStatus(product){
  var status=product&&product.productStatus;
  return status==='new'||status==='mass'||status==='stock'?status:'mass';
}
function worktimeProductStatusLabel(status){return status==='new'?'新产品':status==='stock'?'结存产品':'量产产品';}
function worktimeProductCanRetest(product){return !!product&&!product.deleted&&worktimeProductStatus(product)!=='stock';}
// 每次运算使用当次数据的临时索引，避免产品量到 9999 时重复遍历，也避免缓存失效。
function worktimeBuildIndex(data){
  var index={products:new Map(),reviews:new Map(),tasks:new Map(),tasksByReview:new Map()};
  (data&&Array.isArray(data.worktimeProducts)?data.worktimeProducts:[]).forEach(function(product){if(product&&!index.products.has(product.id))index.products.set(product.id,product);});
  (data&&Array.isArray(data.worktimeReviews)?data.worktimeReviews:[]).forEach(function(review){if(review&&!index.reviews.has(review.id))index.reviews.set(review.id,review);});
  (data&&Array.isArray(data.tasks)?data.tasks:[]).forEach(function(task){
    if(!task)return;
    if(!index.tasks.has(task.id))index.tasks.set(task.id,task);
    if(task.sourceWorktimeReviewId&&!index.tasksByReview.has(task.sourceWorktimeReviewId))index.tasksByReview.set(task.sourceWorktimeReviewId,task);
  });
  return index;
}
function worktimeNumber(value){
  if(typeof value!=='number'&&typeof value!=='string')return NaN;
  if(typeof value==='string'&&!value.trim())return NaN;
  var number=Number(value);return Number.isFinite(number)?number:NaN;
}
function worktimeDay(value){
  if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return '';
  var p=value.split('-').map(Number),date=new Date(0);
  date.setUTCHours(0,0,0,0);date.setUTCFullYear(p[0],p[1]-1,p[2]);
  return p[0]>0&&date.getUTCFullYear()===p[0]&&date.getUTCMonth()===p[1]-1&&date.getUTCDate()===p[2]?value:'';
}
function worktimeLocalDay(value){
  var day=worktimeDay(value);if(day)return day;
  if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}T/.test(value))return '';
  var date=new Date(value);if(!Number.isFinite(date.getTime()))return '';
  return String(date.getFullYear()).padStart(4,'0')+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
}
function worktimeToday(){
  if(typeof todayStr==='function')return todayStr();
  return worktimeLocalDay(new Date().toISOString());
}
function worktimeTimestamp(){return typeof now==='function'?now():new Date().toISOString();}
function worktimeText(value){return typeof value==='string'&&!!value.trim();}
function worktimeProcessMetrics(process,workHours){
  process=process||{};
  var qty=worktimeNumber(process.bomQty),ct=worktimeNumber(process.ct),people=worktimeNumber(process.manpower),hours=worktimeNumber(workHours);
  var bom=qty>=0&&ct>0?qty*ct:0,cycle=ct>0&&people>0?ct/people:0;
  var capacity=hours>0&&cycle>0?hours*3600/cycle:0,uph=cycle>0?3600/cycle:0;
  function finite(value){return Number.isFinite(value)&&value>=0?value:0;}
  return {bomHours:finite(bom),cycleTime:finite(cycle),standardCapacity:finite(capacity),uph:finite(uph)};
}
function worktimeProductMetrics(product){
  var result={totalBomHours:0,totalManpower:0};

  var lightInk=t.textMode==='custom'&&validColor(t.textColor)?contrastRatio(t.textColor,'#121a28')>=contrastRatio(t.textColor,'#ffffff'):light;
  var surface=lightInk?'18,26,40':'255,255,255';
  root.style.setProperty('--surface-rgb',surface);
  root.style.setProperty('--glass','rgba('+surface+','+Math.min(.6,Math.max(.08,pa*.35))+')');
  root.style.setProperty('--glass-edge',lightInk?'rgba(255,255,255,.22)':'rgba(255,255,255,.48)');
  ['--ink','--ink2','--ink3','--line'].forEach(function(k){root.style.removeProperty(k);});

}

function avgBrightness(blob){
  return createImageBitmap(blob).then(function(bmp){
    var cv=document.createElement('canvas');cv.width=32;cv.height=32;
    var ctx=cv.getContext('2d');ctx.drawImage(bmp,0,0,32,32);
    var d=ctx.getImageData(0,0,32,32).data,sum=0;
    for(var i=0;i<d.length;i+=4)sum+=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    bmp.close();
    return sum/(d.length/4)/255;
  });
}

function processImg(bmp,file,preserve){
  var maxSide=Math.max(bmp.width,bmp.height);
  var limit=preserve?6000:3840;
  if(preserve&&maxSide<=6000&&file.type!=='image/jpeg')return Promise.resolve(file);
  var scale=Math.min(1,limit/maxSide);
  var w=Math.round(bmp.width*scale),h=Math.round(bmp.height*scale);
  var cv=document.createElement('canvas');cv.width=w;cv.height=h;
  cv.getContext('2d').drawImage(bmp,0,0,w,h);
  return new Promise(function(res){cv.toBlob(function(b){res(b);},'image/jpeg',0.9);});
}

/* ---------- 云端同步（GitHub Gist） ---------- */
function getSync(){try{return JSON.parse(localStorage.getItem('wb_sync')||'{}');}catch(e){return {};}}
function setSync(o){localStorage.setItem('wb_sync',JSON.stringify(o));}
function pushCloud(){
  var syn=getSync(); if(!syn.gistId||!syn.token)return Promise.resolve();
  return pullCloud()
    .then(function(remote){mergeRemote(remote);})            // 先并入云端独有数据
    .then(function(){
      var body=JSON.stringify({files:{'workbench.json':{content:JSON.stringify(state)}}});
      return fetch('https://api.github.com/gists/'+syn.gistId,{method:'PATCH',headers:{'Authorization':'token '+syn.token,'Content-Type':'application/json'},body:body});
    })
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);})
    .then(function(){localStorage.setItem('wb_sync_at',new Date().toLocaleString('zh-CN'));});
}
function pullCloud(){
  var syn=getSync(); if(!syn.gistId||!syn.token)return Promise.resolve(null);
  return fetch('https://api.github.com/gists/'+syn.gistId,{headers:{'Authorization':'token '+syn.token}})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(g){
      var file=g.files&&g.files['workbench.json'];if(!file)return null;
      if(!file.truncated)return JSON.parse(file.content);
      var raw=new URL(file.raw_url);
      if(raw.protocol!=='https:'||['gist.githubusercontent.com','raw.githubusercontent.com'].indexOf(raw.hostname)<0)throw new Error('无法读取完整云端文件');
      return fetch(raw.href,{headers:{'Authorization':'token '+syn.token}}).then(function(response){if(!response.ok)throw new Error('HTTP '+response.status);return response.json();});
    });
}
// 按 id 逐条合并：updatedAt 较新的一方为准；软删除墓碑随同步传播，旧数据不得复活已删项
function mergeById(localList, remoteList){
  var map={}; localList.forEach(function(x){map[x.id]=x;});
  (remoteList||[]).forEach(function(r){
    var l=map[r.id];
    if(!l){map[r.id]=r;}
    else if((r.updatedAt||'')>(l.updatedAt||'')){map[r.id]=r;}
  });
  return Object.keys(map).map(function(k){return map[k];});
}
function mergeRemote(remote){
  if(!remote||!Array.isArray(remote.tasks))return 0;
  remote=migrate(remote);
  var before=state.tasks.length+state.projects.length+state.worktimeProducts.length;
  state.tasks=mergeById(state.tasks,remote.tasks);
  state.projects=mergeById(state.projects,remote.projects);
  state.worktimeProducts=mergeById(state.worktimeProducts,remote.worktimeProducts);
  state.worktimeReviews=mergeById(state.worktimeReviews,remote.worktimeReviews);
  if((remote.worktimeSettings.updatedAt||'')>(state.worktimeSettings.updatedAt||''))state.worktimeSettings=remote.worktimeSettings;
  if((remote.taskOrderUpdatedAt||'')>(state.taskOrderUpdatedAt||'')){
    state.taskOrder=remote.taskOrder;state.taskOrderUpdatedAt=remote.taskOrderUpdatedAt;
  }
  migrate(state);
  reconcileWorktimeReviews(state,todayStr());
  if(_wbStorageReady)persistWorkbenchState(state);
  return (state.tasks.length+state.projects.length+state.worktimeProducts.length)-before;
}

/* ---------- 日期工具 ---------- */
function dstr(d){var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+dd;}
function today(){return new Date();}
function todayStr(){return dstr(today());}
function offsetDate(n){var d=new Date();d.setDate(d.getDate()+n);return dstr(d);}
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function dayDiff(a,b){return Math.round((parseD(a)-parseD(b))/86400000);} // a-b 天数
function fmtCn(s){var p=s.split('-');return (+p[1])+'月'+(+p[2])+'日';}
function weekRange(){ // 本周周一~周日
  var t=today(), dow=(t.getDay()+6)%7; // 周一=0
  var mon=new Date(t); mon.setDate(t.getDate()-dow);
  var sun=new Date(mon); sun.setDate(mon.getDate()+6);
  return {mon:dstr(mon),sun:dstr(sun)};
}
function relDue(s){ // 截止日相对今天的描述
  var diff=dayDiff(s,todayStr());
  if(diff===0) return '今天';
  if(diff===-1) return '昨天';
  if(diff===1) return '明天';
  if(diff<0) return '已延期'+(-diff)+'天';
  return '剩'+diff+'天';
}

function openTasks(){return state.tasks.filter(function(t){return !t.done&&!t.deleted;});}
function overdueTasks(){return openTasks().filter(function(t){return dayDiff(t.due,todayStr())<0;});}
function dueTodayTasks(){return openTasks().filter(function(t){return t.due===todayStr();});}
function waitingTasks(){return openTasks().filter(function(t){return t.waiting;});}
function doneTodayTasks(){return state.tasks.filter(function(t){return t.done&&t.doneAt===todayStr()&&!t.deleted;});}
function projStats(p){
  var all=state.tasks.filter(function(t){return t.projectId===p.id&&!t.deleted;});
  var done=all.filter(function(t){return t.done;}).length;
  return {total:all.length,done:done,left:all.length-done};
}
function projStatus(p){
  var s=projStats(p);
  if(p.persistent) return 'ongoing'; // 持续跟进类项目（如工时测量），不自动判完成
  if(s.left===0&&s.total>0) return 'done';
  if(p.blocked) return 'blocked';
  var diff=dayDiff(p.deadline,todayStr());
  if(diff<0) return 'overdue';
  if(diff<=3) return 'due';
  return 'ok';
}

function saveTask(id){
  var title=document.getElementById('fTitle').value.trim();
  if(!title){toast('请填写任务名称');return;}
  var data={
    title:title,
    projectId:document.getElementById('fProj').value,
    category:document.getElementById('fCate').value,
    startDate:document.getElementById('fStart').value||todayStr(),
    due:document.getElementById('fDue').value||todayStr(),
    prio:document.getElementById('fPrio').value,
    detail:document.getElementById('fDetail').value.trim(),
    assignee:document.getElementById('fAssignee').value.trim()||'我',
    waiting:document.getElementById('fWait').value==='1',
    waitSince:document.getElementById('fWait').value==='1'?todayStr():null,
    focus:document.getElementById('fFocus').checked,
    updatedAt:now()
  };
  if(!id||!state.tasks.find(function(x){return x.id===id;}).done)Object.assign(data,modalColors());
  if(id){
    var t=state.tasks.find(function(x){return x.id===id;});
    Object.assign(t,data);
  }else{
    var task=Object.assign({id:uid(),status:'in_progress',blocked:false,done:false,doneAt:null,createdAt:todayStr()},data);
    state.tasks.push(task);if(state.taskOrder.length){state.taskOrder.push(task.id);state.taskOrderUpdatedAt=now();}
  }
  save(); renderAll(); closeModal(); toast(id?'已保存':'任务已添加');
}
function delTask(id){
  var task=state.tasks.find(function(t){return t.id===id&&!t.deleted&&!t.systemDemo;});
  if(!task)return;
  task.deleted=true;task.deletedAt=now();task.updatedAt=now();
  selectedTaskIds.delete(id);save();closeModal();renderAll();toast('任务已移入回收站');
}

function saveProj(id){
  var name=document.getElementById('pName').value.trim();
  if(!name){toast('请填写项目名称');return;}
  var start=document.getElementById('pStart').value||todayStr(),due=document.getElementById('pDue').value||offsetDate(14);
  if(start>due){toast('开始日期不能晚于交付截止');return;}
  var st=document.getElementById('pStatus').value;
  var data={name:name,startDate:start,deadline:due,blocked:st==='blocked',persistent:st==='ongoing',nextStep:document.getElementById('pNext').value.trim(),updatedAt:now()};
  Object.assign(data,modalColors());
  if(id){Object.assign(state.projects.find(function(x){return x.id===id;}),data);}
  else{state.projects.push(Object.assign({id:uid(),createdAt:todayStr()},data));}
  save();renderAll();closeModal();toast(id?'项目已保存':'项目已创建');

function delProj(id){
  var p=state.projects.find(function(x){return x.id===id;});
  if(p){p.deleted=true; p.deletedAt=now(); p.updatedAt=now();}
  state.tasks.forEach(function(t){if(t.projectId===id&&!t.deleted){t.deleted=true; t.deletedAt=now(); t.updatedAt=now();}});
  save(); renderAll(); closeModal(); toast('项目及关联任务已删除（将同步到另一端）');
}
function toggleBlock(id){
  var p=state.projects.find(function(x){return x.id===id;});
  if(p){p.blocked=!p.blocked; p.updatedAt=now(); save(); renderAll(); toast(p.blocked?'已标记阻塞':'已恢复正常');}
}

function riskRows(){
  var rows=[];
  // 1 过期未完
  var od=overdueTasks();
  rows.push({sev:od.length?'red':'green',title:'过期未完任务',desc:od.length?od.map(function(t){return t.title+'（延期'+-dayDiff(t.due,todayStr())+'天）';}).join('、'):'当前没有过期任务',cnt:od.length});
  // 2 24h内截止
  var d24=openTasks().filter(function(t){var d=dayDiff(t.due,todayStr());return d===0;});
  rows.push({sev:d24.length?'amber':'green',title:'24 小时内截止',desc:d24.length?d24.map(function(t){return t.title;}).join('、'):'今天没有临期任务',cnt:d24.length});
  // 3 3天内未交付项目
  var dueP=state.projects.filter(function(p){var d=dayDiff(p.deadline,todayStr());return !p.deleted&&d>=0&&d<=3&&projStatus(p)!=='done';});
  rows.push({sev:dueP.length?'amber':'green',title:'3 天内需交付项目',desc:dueP.length?dueP.map(function(p){return p.name+'（剩'+dayDiff(p.deadline,todayStr())+'天）';}).join('、'):'近期无临期项目',cnt:dueP.length});
  // 4 手动阻塞项目
 var blk=state.projects.filter(function(p){return !p.deleted&&p.blocked;});
  rows.push({sev:blk.length?'red':'green',title:'手动阻塞项目',desc:blk.length?blk.map(function(p){return p.name+'：'+(p.nextStep||'待解除阻塞');}).join('、'):'没有阻塞中的项目',cnt:blk.length});
  // 5 等待超3天
  var wt=waitingTasks().filter(function(t){return t.waitSince&&dayDiff(todayStr(),t.waitSince)>=3;});
  rows.push({sev:wt.length?'red':'green',title:'等待他人超 3 天',desc:wt.length?wt.map(function(t){return t.title+'（已等'+dayDiff(todayStr(),t.waitSince)+'天）';}).join('、'):'等待中的事项都在 3 天内',cnt:wt.length});
  return rows;
}

/* ================= 视图：工作复盘 ================= */
function weekStats(){
  var wr=weekRange();
  var all=state.tasks;
  var all=state.tasks.filter(function(t){return !t.deleted;});
  var created=all.filter(function(t){return t.createdAt>=wr.mon&&t.createdAt<=wr.sun;});
  var doneW=all.filter(function(t){return t.done&&t.doneAt&&t.doneAt>=wr.mon&&t.doneAt<=wr.sun;});
  var left=openTasks();
  var total=doneW.length+left.length;
  var rate=total?Math.round(doneW.length/total*100):0;
  return {wr:wr,created:created.length,done:doneW.length,left:left.length,rate:rate,doneList:doneW,leftList:left};
}

  var h='<div class="card"><div class="card-h"><h3>本周概览（'+fmtCn(s.wr.mon)+' — '+fmtCn(s.wr.sun)+'）</h3></div>'+

function genReport(){
  var s=weekStats();
  var projs=state.projects.filter(function(p){return !p.deleted&&projStatus(p)!=='done';});
  var risks=riskRows().filter(function(r){return r.cnt>0;});
  var lines=[];
  lines.push('【本周工作周报】');
  lines.push('周期：'+fmtCn(s.wr.mon)+' — '+fmtCn(s.wr.sun));
  lines.push('');
  lines.push('一、本周完成（'+s.done+' 项）');
  if(s.doneList.length)s.doneList.forEach(function(t,i){lines.push((i+1)+'. '+t.title);});
  else lines.push('（暂无）');
  lines.push('');
  lines.push('二、进行中项目');
  if(projs.length)projs.forEach(function(p){lines.push('· '+p.name+'：'+(p.nextStep||'推进中'));});
  else lines.push('（无）');
  lines.push('');
  lines.push('三、风险与阻塞');
  if(risks.length)risks.forEach(function(r){lines.push('· '+r.title+'：'+r.cnt+' 项');});
  else lines.push('（无）');
  lines.push('');
  lines.push('四、未完事项（'+s.left+' 项）');
  if(s.leftList.length)s.leftList.slice(0,8).forEach(function(t,i){lines.push((i+1)+'. '+t.title+'（截止 '+fmtCn(t.due)+'）');});
  else lines.push('（无）');
  lines.push('');
  lines.push('五、下周重点');
  var top=openTasks().slice().sort(function(a,b){return a.due<b.due?-1:1;}).slice(0,3);
  top.forEach(function(t,i){lines.push((i+1)+'. '+t.title);});
  var txt=lines.join('\n');
  openModal('<h3>本周周报草稿</h3><div class="copybox" id="reportBox">'+esc(txt)+'</div>'+
    '<div class="modal-ops"><button class="btn" onclick="closeModal()">关闭</button>'+
    '<button class="btn primary" onclick="copyReport()">复制全文</button></div>');
}
function copyReport(){
  var txt=document.getElementById('reportBox').innerText;
  function done(){toast('已复制，可粘贴到钉钉/邮件');}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt,done);});}
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,cb){
  var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);cb();
}

/* ================= 持久配色：从完整 RGB 色域抽样，文字对比度至少 4.5 ================= */
function validColor(c){return typeof c==='string'&&/^#[0-9a-f]{6}$/i.test(c);}
function colorLuminance(c){
  var rgb=[1,3,5].map(function(i){var v=parseInt(c.slice(i,i+2),16)/255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);});
  return rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722;
}
function contrastRatio(a,b){var x=colorLuminance(a),y=colorLuminance(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
function randomHex(){var a=new Uint8Array(3);crypto.getRandomValues(a);return '#'+Array.from(a,function(v){return v.toString(16).padStart(2,'0');}).join('');}
function readableInk(bg){
  for(var i=0;i<300;i++){var ink=randomHex();if(contrastRatio(bg,ink)>=4.5)return ink;}
  return contrastRatio(bg,'#000000')>=contrastRatio(bg,'#ffffff')?'#000000':'#ffffff';
}
function randomColors(){var bg=randomHex();return {bgColor:bg,textColor:readableInk(bg)};}
function ensureItemColors(item){
  // 旧记录按 id 补色，避免不同设备迁移时得到不同背景。
  if(!validColor(item.bgColor)){var hash=2166136261;String(item.id||'item').split('').forEach(function(c){hash=Math.imul(hash^c.charCodeAt(0),16777619);});item.bgColor='#'+(hash>>>0).toString(16).padStart(8,'0').slice(-6);}
  if(!validColor(item.textColor)||contrastRatio(item.bgColor,item.textColor)<4.5){item.textColor=contrastRatio(item.bgColor,'#000000')>=contrastRatio(item.bgColor,'#ffffff')?'#000000':'#ffffff';}
  return item;
}
function itemStyle(item){ensureItemColors(item);return '--item-bg:'+item.bgColor+';--item-ink:'+item.textColor+';--item-scheme:'+(colorLuminance(item.bgColor)<.2?'dark':'light');}
function colorFields(item){return '<div class="color-fields"><label class="color-label">背景<input type="color" id="itemBg" value="'+item.bgColor+'" oninput="changeItemColor(\'background\')"></label><label class="color-label">文字<input type="color" id="itemInk" value="'+item.textColor+'" oninput="changeItemColor(\'text\')"></label><button class="btn sm" type="button" onclick="rerollItemColors()">随机配色</button><span class="color-code" id="colorRatio"></span></div>';}
function applyModalColors(item){var box=document.getElementById('modalBox');box.classList.add('item-colored');box.style.cssText=itemStyle(item);box._colors={bgColor:item.bgColor,textColor:item.textColor};updateColorRatio();}
function updateColorRatio(){var el=document.getElementById('colorRatio'),box=document.getElementById('modalBox');if(el&&box._colors)el.textContent='对比度 '+contrastRatio(box._colors.bgColor,box._colors.textColor).toFixed(2)+' : 1';}
function changeItemColor(which){
  var bg=document.getElementById('itemBg').value,ink=document.getElementById('itemInk').value;
  if(contrastRatio(bg,ink)<4.5){
    if(which==='text'){document.getElementById('itemInk').value=document.getElementById('modalBox')._colors.textColor;toast('文字与背景太接近，请选择更醒目的颜色');return;}
    ink=readableInk(bg);document.getElementById('itemInk').value=ink;
  }
  applyModalColors({bgColor:bg,textColor:ink});
}
function rerollItemColors(){var c=randomColors();document.getElementById('itemBg').value=c.bgColor;document.getElementById('itemInk').value=c.textColor;applyModalColors(c);}

async function toggleSelectAllTasks(){
  var list=getVisibleTasks(),deselect=list.length&&list.every(function(t){return selectedTaskIds.has(t.id);}),run=++_selectionRun;
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  for(var i=0;i<list.length;i++){
    if(run!==_selectionRun||location.hash!=='#tasks')break;
    var t=list[i],input=Array.from(document.querySelectorAll('#taskList .task-selection')).find(function(el){return el.dataset.selectId===t.id;});
    if(!input)continue;
    if(deselect)selectedTaskIds.delete(t.id);else selectedTaskIds.add(t.id);
    input.checked=!deselect;
    if(!reduced){input.animate([{transform:'scale(1)'},{transform:'scale(1.25)',offset:.5},{transform:'scale(.95)',offset:.8},{transform:'scale(1)'}],{duration:300,easing:'ease-out'});}
    syncSelectionUI();
    if(!reduced)await new Promise(function(resolve){setTimeout(resolve,65);});
  }
  if(run===_selectionRun)syncSelectionUI();
}

var _deckExpanded=false,_deckFrame=0,_deckObserver=null,_deckStates=new Map();
function reducedMotion(){return window.matchMedia('(prefers-reduced-motion: reduce)').matches;}

function stopTaskMomentum(){if(_taskMomentum){cancelAnimationFrame(_taskMomentum.frame);_taskMomentum=null;}}
function startTaskMomentum(velocity){
  stopTaskMomentum();
  if(reducedMotion()||Math.abs(velocity)<.06)return;
  var motion={velocity:Math.max(-2,Math.min(2,velocity)),last:performance.now(),started:performance.now(),frame:0};

/* ================= 三态任务界面与开始/完成日期筛选 ================= */
var taskViewStatus='all';

  var error=validateWorktimeProduct(product);if(error){toast('请完善信息后导出：'+error);return;}
  try{
    var result=downloadWorktimeXlsx(product),previous=_worktimeExportReceipts[product.id];
    _worktimeExportReceipts[product.id]={signature:worktimeExportSignature(product),filename:result.filename,exportedAt:now()};
    if(!await save()){if(previous)_worktimeExportReceipts[product.id]=previous;else delete _worktimeExportReceipts[product.id];renderAll();return;}
    renderAll();logOperation('worktime_product_export',{productId:id,count:product.processes.length});
    toast('已发起 Excel 下载，确认保存后可删除卡片');
  }catch(error){toast('Excel 导出失败，请重试');logOperation('operation_error',{source:'worktime_export',errorName:safeOperationErrorName(error)});}
}
function deleteWorktimeProduct(id){
  var product=state.worktimeProducts.find(function(item){return item.id===id&&!item.deleted;});
  if(!product)return;if(!canDeleteWorktimeProduct(product)){toast('请先导出当前版本的 Excel');return;}
  openModal('<div class="worktime-editor worktime-delete-confirm"><h3>删除产品卡片</h3><p>'+esc(product.pn)+' · '+esc(product.name)+'</p><p style="margin:12px 0">请确认已下载的 '+esc(_worktimeExportReceipts[product.id].filename)+' 可以正常打开，再删除此卡片。</p><div class="modal-ops"><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" data-product-id="'+esc(id)+'" onclick="confirmDeleteWorktimeProduct(this.dataset.productId)">确认已保存并删除</button></div></div>');
}
async function confirmDeleteWorktimeProduct(id){
  var product=state.worktimeProducts.find(function(item){return item.id===id&&!item.deleted;});
  if(!canDeleteWorktimeProduct(product)){toast('产品内容已更新，请重新导出 Excel');return;}
  var previous=JSON.parse(JSON.stringify(product));product.deleted=true;product.deletedAt=now();product.updatedAt=now();
  if(!await save()){Object.assign(product,previous);delete product.deleted;delete product.deletedAt;return;}
  refreshWorktimeReviews();closeModal();renderAll();logOperation('worktime_product_delete',{productId:id});toast('产品卡片已删除');
}

function sanitizeOperationDetail(detail){

  if(['home','projects','tasks','recycle','worktime','worktime-retest','risks','review','data','mail','appearance','info'].indexOf(detail.route)>=0)result.route=detail.route;
  ['fromIndex','toIndex','count'].forEach(function(key){var v=detail[key];if(Number.isInteger(v)&&v>=0&&v<=1000000)result[key]=v;});
  if(Number.isInteger(detail.httpStatus)&&detail.httpStatus>=100&&detail.httpStatus<=599)result.httpStatus=detail.httpStatus;
  if(detail.errorName)result.errorName=safeOperationErrorName({name:detail.errorName});

function operationSessionId(){

function initializeOperationLog(){

    if(Array.isArray(stored))stored.slice(-OPERATION_LOG_LIMIT).forEach(function(entry){
      if(!entry||!Object.prototype.hasOwnProperty.call(OPERATION_EVENT_LABELS,entry.action)||typeof entry.time!=='string'||!/^\d{4}-\d{2}-\d{2}T[0-9:.]+Z$/.test(entry.time))return;
      _operationLogEntries.push({time:entry.time,sessionId:typeof entry.sessionId==='string'&&/^[a-zA-Z0-9_-]{1,80}$/.test(entry.sessionId)?entry.sessionId:'previous',sequence:Number.isInteger(entry.sequence)?entry.sequence:0,action:entry.action,label:OPERATION_EVENT_LABELS[entry.action],detail:sanitizeOperationDetail(entry.detail)});
    });
  }catch(e){}
}
function logOperation(action,detail){
  try{
    if(!Object.prototype.hasOwnProperty.call(OPERATION_EVENT_LABELS,action))return;
    initializeOperationLog();
    var entry={time:new Date().toISOString(),sessionId:operationSessionId(),sequence:++_operationSequence,action:action,label:OPERATION_EVENT_LABELS[action],detail:sanitizeOperationDetail(detail)};
    _operationLogEntries.push(entry);
    if(_operationLogEntries.length>OPERATION_LOG_LIMIT)_operationLogEntries.splice(0,_operationLogEntries.length-OPERATION_LOG_LIMIT);
    try{localStorage.setItem(OPERATION_LOG_KEY,JSON.stringify(_operationLogEntries));}catch(e){}
    return entry;
  }catch(e){}
